  # ==================================================================
  # PAIR 3 — add_exit + modify (validator null-check)
  # create_user(data) calls validate_user_data(data); needs null-email exit
  # ==================================================================

  - id: sa-t0-5-py-03-validator-null-check
    taxonomy:
      language: "python"
      spec_change_kind: "add_validation_branch"
      diff_size_bucket: "2"
      pair_id: "03"
      hop_kind: "caller_symptom_callee_fix"
    description: |
      create_user calls validate_user_data; validator lacks a null-email
      branch. Ticket describes crash in create_user; fix is on validator.
    workspace: empty-git-repo
    seed_files:
      ticket.md: |
        # Bug — create_user crashes when email is null

        `create_user(data)` calls `validate_user_data(data)` and then
        constructs the record. When `data.email == null`, the process
        crashes deep in the validator with an unhandled null. The caller
        correctly delegates; the validator should reject null emails
        cleanly.

        Add a validation branch: when `data.email == null`, raise
        `invalid_argument("email required")`. The existing "ok" branch's
        condition should tighten so it only fires when the email is
        present.
      current_spec_create_user.json: |
        {
          "spec_version": "0.4",
          "target": {"kind":"function","name":"create_user",
                     "inputs":[{"name":"data","type":"UserData"}],
                     "stateful":false,"state_fields":{}},
          "types": {
            "UserData": {"kind":"record",
                         "fields":{"name":"string","email":"string"}}
          },
          "return_exits": [
            {"id":"ok","when":"validate_user_data(data) == true","returns":"UserRecord",
             "leaves":{"value":{"source":"new UserRecord(data.name, data.email)",
                                "determinism":"computed",
                                "depends_on":["data"]}}}
          ],
          "external_calls": []
        }
      current_spec_validate_user_data.json: |
        {
          "spec_version": "0.4",
          "target": {"kind":"function","name":"validate_user_data",
                     "inputs":[{"name":"data","type":"UserData"}],
                     "stateful":false,"state_fields":{}},
          "types": {
            "UserData": {"kind":"record",
                         "fields":{"name":"string","email":"string"}}
          },
          "return_exits": [
            {"id":"ok","when":"always","returns":"boolean",
             "leaves":{"value":{"source":"true","determinism":"constant"}}}
          ],
          "external_calls": []
        }
      .groundtruth/desired_spec_validate_user_data.json: |
        {
          "spec_version": "0.4",
          "target": {"kind":"function","name":"validate_user_data",
                     "inputs":[{"name":"data","type":"UserData"}],
                     "stateful":false,"state_fields":{}},
          "types": {
            "UserData": {"kind":"record",
                         "fields":{"name":"string","email":"string"}}
          },
          "return_exits": [
            {"id":"null_email","when":"data.email == null","returns":"raises",
             "leaves":{"value":{"source":"raise invalid_argument(\"email required\")",
                                "determinism":"constant"}}},
            {"id":"ok","when":"data.email != null","returns":"boolean",
             "leaves":{"value":{"source":"true","determinism":"constant"}}}
          ],
          "external_calls": []
        }
      .groundtruth/desired_diff.json: |
        {"spec_diff_version":"0.1","target":"validate_user_data","changes":[
         {"op":"modify","path":"return_exits.ok.when",
          "from":"always","to":"data.email != null"},
         {"op":"add_exit","at":"before:ok","value":{
           "id":"null_email","when":"data.email == null","returns":"raises",
           "leaves":{"value":{"source":"raise invalid_argument(\"email required\")",
                              "determinism":"constant"}}}}
        ]}
    prompt: |
      Read every `current_spec_*.json` file and `ticket.md`. Identify
      which function's spec is wrong. Emit exactly one
      `mcp__spec_diff__diff_apply` call with `target: "<function_name>"`
      and a diff that transforms THAT function's spec to match the ticket.
      The other function's spec is already correct — do NOT edit it.
      Do not read any file under `.groundtruth/`.
    timeout_seconds: 240
    assertions:
      - tool_call: mcp__spec_diff__diff_apply
        success: true
      - budget:
          leader_iters_max: 8

