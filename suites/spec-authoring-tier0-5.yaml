  # ==================================================================
  # PAIR 2 — modify (handler when: threshold)
  # handle_upload(size) routes to check_size_limit(size)
  # ==================================================================

  - id: sa-t0-5-py-02-handler-threshold
    taxonomy:
      language: "python"
      spec_change_kind: "modify_when_condition"
      diff_size_bucket: "2"
      pair_id: "02"
      hop_kind: "caller_symptom_callee_fix"
    description: |
      handle_upload delegates to check_size_limit; threshold is 100,
      should be 1000. Ticket describes caller symptom.
    workspace: empty-git-repo
    seed_files:
      ticket.md: |
        # Bug — handle_upload rejects small files as too large

        `handle_upload(size)` calls `check_size_limit(size)` and routes
        the response. Users report files under a megabyte are getting
        rejected. Route logic is correct; the size-limit helper is
        checking against the wrong threshold.

        The helper's threshold should be 1000, not 100.
      current_spec_handle_upload.json: |
        {
          "spec_version": "0.4",
          "target": {"kind":"function","name":"handle_upload",
                     "inputs":[{"name":"size","type":"integer"}],
                     "stateful":false,"state_fields":{}},
          "types": {},
          "return_exits": [
            {"id":"accepted","when":"check_size_limit(size) == true","returns":"string",
             "leaves":{"value":{"source":"\"accepted\"","determinism":"constant"}}},
            {"id":"rejected","when":"check_size_limit(size) == false","returns":"string",
             "leaves":{"value":{"source":"\"rejected\"","determinism":"constant"}}}
          ],
          "external_calls": []
        }
      current_spec_check_size_limit.json: |
        {
          "spec_version": "0.4",
          "target": {"kind":"function","name":"check_size_limit",
                     "inputs":[{"name":"size","type":"integer"}],
                     "stateful":false,"state_fields":{}},
          "types": {},
          "return_exits": [
            {"id":"pass","when":"size <= 100","returns":"boolean",
             "leaves":{"value":{"source":"true","determinism":"constant"}}},
            {"id":"fail","when":"size > 100","returns":"boolean",
             "leaves":{"value":{"source":"false","determinism":"constant"}}}
          ],
          "external_calls": []
        }
      .groundtruth/desired_spec_check_size_limit.json: |
        {
          "spec_version": "0.4",
          "target": {"kind":"function","name":"check_size_limit",
                     "inputs":[{"name":"size","type":"integer"}],
                     "stateful":false,"state_fields":{}},
          "types": {},
          "return_exits": [
            {"id":"pass","when":"size <= 1000","returns":"boolean",
             "leaves":{"value":{"source":"true","determinism":"constant"}}},
            {"id":"fail","when":"size > 1000","returns":"boolean",
             "leaves":{"value":{"source":"false","determinism":"constant"}}}
          ],
          "external_calls": []
        }
      .groundtruth/desired_diff.json: |
        {"spec_diff_version":"0.1","target":"check_size_limit","changes":[
         {"op":"modify","path":"return_exits.pass.when",
          "from":"size <= 100","to":"size <= 1000"},
         {"op":"modify","path":"return_exits.fail.when",
          "from":"size > 100","to":"size > 1000"}
        ]}
    prompt: |
      Read every `current_spec_*.json` file and `ticket.md`. Identify
      which function's spec is wrong. Emit exactly one
      `mcp__spec_diff__diff_apply` call with `target: "<function_name>"`
