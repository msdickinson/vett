  # ==================================================================
  # PAIR 4 — remove_exit + add_exit (helper error-kind rename)
  # process_payment(tx) calls check_balance(user, amount); wrong error kind
  # ==================================================================

  - id: sa-t0-5-py-04-error-kind-rename
    taxonomy:
      language: "python"
      spec_change_kind: "rename_exit_change_returns"
      diff_size_bucket: "2"
      pair_id: "04"
      hop_kind: "caller_symptom_callee_fix"
    description: |
      process_payment calls check_balance; check_balance raises the
      wrong exception kind on insufficient balance. Fix is on the helper.
      Tests id-immutability rule (rename via remove+add).
    workspace: empty-git-repo
    seed_files:
      ticket.md: |
        # Bug — process_payment surfaces wrong exception on insufficient balance

        `process_payment(tx)` calls `check_balance(user, amount)` and
        propagates its exceptions. Callers see `precondition_failed`
        when the user's balance is too low. That's semantically wrong —
        insufficient balance is an input problem, not a precondition
        violation. Fix is in the helper: it should raise
        `invalid_argument("insufficient balance")` instead.

        Rename the "insufficient" exit accordingly. The "ok" branch is
        unchanged.
      current_spec_process_payment.json: |
        {
          "spec_version": "0.4",
          "target": {"kind":"function","name":"process_payment",
                     "inputs":[{"name":"tx","type":"Transaction"}],
                     "stateful":false,"state_fields":{}},
          "types": {
            "Transaction": {"kind":"record",
                            "fields":{"user":"User","amount":"number"}}
