name: spec-authoring-tier0-5
description: |
  T0.5 — one-hop synthetic spec-authoring probes. 10 instances = 5 semantic
  pairs, each paired 1:1 Python↔C#. Adds ONE new capability over T0: the
  ticket describes symptoms visible in caller `f()`, but the fix belongs
  to callee `g()`. The AI must reason across the call boundary to pick
  the right target, then emit a diff scoped to that target.

  Workspace layout per instance (unlike T0's single spec):
    - current_spec_<caller>.json  — the function whose behavior the ticket describes
    - current_spec_<callee>.json  — the function that actually needs the fix
    - .groundtruth/desired_spec_<callee>.json  — ground truth (fix target only)
    - ticket.md — describes caller symptom, does NOT name the fix location

  The AI passes `target: "<name>"` on its `diff_apply` call so the server
  loads `current_spec_<name>.json`. Backward-compatible with T0 (no target
  → falls back to `current_spec.json`).

  What T0.5 measures beyond T0:
    - Target-selection correctness: did the AI pick the right callee?
    - Cross-spec reasoning: did the AI leave the caller alone?
    - Q1/Q2 tracked exactly as T0.

  Advance bar to T1: Q1 ≥ 90%, Q2-semantic ≥ 80%. Below → diagnose per-
  instance before adding more corpus.

  Diff ops covered:
    Pair 1: modify (leaf source on callee)
    Pair 2: modify (when: threshold on handler)
    Pair 3: add_exit + modify (null-check exit on validator)
    Pair 4: remove_exit + add_exit (error-kind rename on helper)
    Pair 5: add_leaf (new response field on helper)

  Run:
    vett team-bench spec-authoring-tier0-5 --profile spec-authoring-solo \
      --keep-all-worktrees --json > t0.5.json
  Score:
    python spec_q1_report.py t0.5.json \
      --out t0-5-results.md

profile: spec-authoring-solo
tier: 0

instances:

  # ==================================================================
  # PAIR 1 — modify (helper leaf source)
  # sum_bumps(items) sums bump(x); bump has an off-by-one
  # ==================================================================

  - id: sa-t0-5-py-01-helper-off-by-one
    taxonomy:
      language: "python"
      spec_change_kind: "modify_leaf_source"
      diff_size_bucket: "1"
      pair_id: "01"
      hop_kind: "caller_symptom_callee_fix"
    description: |
      sum_bumps(items) sums the results of bump(x). Sum comes back too
      small — bump is off by one. Fix is on the callee.
    workspace: empty-git-repo
    seed_files:
      ticket.md: |
        # Bug — sum_bumps returns lower total than expected

        `sum_bumps(items)` sums `bump(x)` across the list. Users report the
        total is exactly `len(items)` lower than expected. Investigation
        shows `sum_bumps` correctly delegates; the arithmetic error is in
        its helper.

        The helper should add 2 to each input, not 1.
      current_spec_sum_bumps.json: |
        {
          "spec_version": "0.4",
          "target": {"kind":"function","name":"sum_bumps",
                     "inputs":[{"name":"items","type":"list<integer>"}],
                     "stateful":false,"state_fields":{}},
          "types": {},
          "return_exits": [
            {"id":"ok","when":"always","returns":"integer",
             "leaves":{"value":{"source":"sum(bump(x) for x in items)",
                                "determinism":"computed",
                                "depends_on":["items","bump"]}}}
          ],
          "external_calls": []
        }
      current_spec_bump.json: |
        {
          "spec_version": "0.4",
          "target": {"kind":"function","name":"bump",
                     "inputs":[{"name":"x","type":"integer"}],
                     "stateful":false,"state_fields":{}},
          "types": {},
          "return_exits": [
            {"id":"always","when":"always","returns":"integer",
             "leaves":{"value":{"source":"x + 1","determinism":"computed",
                                "depends_on":["x"]}}}
          ],
          "external_calls": []
        }
      .groundtruth/desired_spec_bump.json: |
        {
          "spec_version": "0.4",
          "target": {"kind":"function","name":"bump",
                     "inputs":[{"name":"x","type":"integer"}],
                     "stateful":false,"state_fields":{}},
          "types": {},
          "return_exits": [
            {"id":"always","when":"always","returns":"integer",
             "leaves":{"value":{"source":"x + 2","determinism":"computed",
                                "depends_on":["x"]}}}
          ],
          "external_calls": []
        }
      .groundtruth/desired_diff.json: |
        {"spec_diff_version":"0.1","target":"bump","changes":[
         {"op":"modify","path":"return_exits.always.leaves.value.source",
          "from":"x + 1","to":"x + 2"}
        ]}
    prompt: |
      Read every `current_spec_*.json` file and `ticket.md`. Identify
      which function's spec is wrong. Emit exactly one
      `mcp__spec_diff__diff_apply` call with `target: "<function_name>"`
      and a diff that transforms THAT function's spec to match the ticket.
      The other function's spec is already correct — do NOT edit it.
      Do not read any file under `.groundtruth/`.
    timeout_seconds: 240
    assertions:
      - tool_call: mcp__spec_diff__diff_apply
        success: true
      - budget:
          leader_iters_max: 8

