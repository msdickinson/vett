name: team-method-tier1
description: |
  Method-level benchmarks: agent implements a single C# method to make
  a seeded xUnit Theory suite pass. Verification is `dotnet test` —
  pure deterministic, no LLM judge. Each instance ships ~25-80 InlineData
  cases, so a stub like `return true` fails decisively (e.g. half the
  cases fail).

  Layout per instance: a single .NET 10 test project that contains
  BOTH the seeded test file (M{N}_Tests.cs) AND an empty implementation
  file (Methods.cs) the agent fills in. Single project keeps cold build
  fast and the agent's mental model simple.

  Run: vett team-bench team-method-tier1

profile: ds-team-flash
tier: 1

instances:
  - id: m1-is-palindrome
    taxonomy:
      file_count_bucket: "1"
      has_network_io: "no"
      ambiguity_level: "low"
      complexity_tier: "1"
      requires_test_writing: "no"
      touches_state_or_persistence: "no"
      novel_api_vs_known: "known"
      requires_cross_file_changes: "no"
      requires_external_research: "no"
    description: Implement IsPalindrome(string) -> bool. ~30 cases.
    workspace: empty-git-repo
    seed_files:
      Methods.csproj: |
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net10.0</TargetFramework>
            <ImplicitUsings>enable</ImplicitUsings>
            <Nullable>enable</Nullable>
            <IsPackable>false</IsPackable>
            <RootNamespace>MethodBench</RootNamespace>
            <AssemblyName>MethodBench</AssemblyName>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="Microsoft.NET.Test.Sdk" Version="17.14.1" />
            <PackageReference Include="xunit" Version="2.9.3" />
            <PackageReference Include="xunit.runner.visualstudio" Version="3.1.4" />
          </ItemGroup>
          <ItemGroup>
            <Using Include="Xunit" />
          </ItemGroup>
        </Project>
      M1_Tests.cs: |
        namespace MethodBench;

        public class M1_IsPalindrome_Tests
        {
            // Case-insensitive, ignores any character that isn't a letter
            // or digit. Empty and single-char strings are palindromes.
            [Theory]
            [InlineData("", true)]
            [InlineData("a", true)]
            [InlineData("Z", true)]
            [InlineData("aa", true)]
            [InlineData("ab", false)]
            [InlineData("aba", true)]
            [InlineData("abc", false)]
            [InlineData("racecar", true)]
            [InlineData("Racecar", true)]
            [InlineData("RaceCar", true)]
            [InlineData("hello", false)]
            [InlineData("hello world", false)]
            [InlineData("noon", true)]
            [InlineData("Noon", true)]
            [InlineData("12321", true)]
            [InlineData("12345", false)]
            [InlineData("A man a plan a canal Panama", true)]
            [InlineData("No 'x' in Nixon", true)]
            [InlineData("Was it a car or a cat I saw?", true)]
            [InlineData("Madam, I'm Adam.", true)]
            [InlineData("Not a palindrome", false)]
            [InlineData(" ", true)]
            [InlineData("  ", true)]
            [InlineData("!@#$%", true)]
            [InlineData("a!b!a", true)]
            [InlineData("a!b!c", false)]
            [InlineData("12 21", true)]
            [InlineData("10 01", true)]
            [InlineData("Able was I ere I saw Elba", true)]
            [InlineData("almost a palindrome but not", false)]
            public void Cases(string input, bool expected)
                => Assert.Equal(expected, Methods.IsPalindrome(input));
        }
    prompt: |
      Use `assign_task` to dispatch an implementer with the following
      task — DO NOT do it yourself. Then review and accept_dispatch.

      Implementer's task:

      Create `Methods.cs` in the workspace root containing a public
      static class `Methods` in the `MethodBench` namespace, with a
      single method:

          public static bool IsPalindrome(string s)

      Behavior:
        - empty / single-char strings return true
        - case-insensitive
        - ignore any character that isn't a letter or digit (so
          "A man a plan a canal Panama" returns true)
        - otherwise: does it read the same forwards and backwards?

      Run `dotnet test` as part of your self-audit (the AUDIT block
      requires it). The harness will re-run tests independently to
      grade — your run is for your own verification. Create Methods.cs and
      report done; the bench harness verifies. The seeded `M1_Tests.cs`
      contains the xUnit cases and the harness runs them after you
      finish.
    timeout_seconds: 360
    assertions:
      - file: Methods.cs
        exists: true
      - dotnet_test:
          cwd: "."
          timeout_seconds: 300
          min_passed: 28
          max_failed: 0
      - no_event: malformed_tool_call
        max_count: 3
      - budget:
          member_iters_max: 22
          leader_iters_max: 18

