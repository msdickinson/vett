            <PackageReference Include="xunit" Version="2.9.3" />
            <PackageReference Include="xunit.runner.visualstudio" Version="3.1.4" />
          </ItemGroup>
          <ItemGroup><Using Include="Xunit" /></ItemGroup>
        </Project>
      MetricRecorder.cs: |
        namespace Migration;

        public class MetricRecorder
        {
            public List<(string Name, int Value)> Records { get; } = new();
            // Migration: remove `tag` parameter (unused). Signature becomes (string name, int value).
            public void Track(string name, string tag, int value) => Records.Add((name, value));
        }
      RequestPipeline.cs: |
        namespace Migration;

        public class RequestPipeline
        {
            private readonly MetricRecorder _m;
            public RequestPipeline(MetricRecorder m) => _m = m;
            public void OnRequest() => _m.Track("requests", "ignored", 1);
        }
      ErrorReporter.cs: |
        namespace Migration;

        public class ErrorReporter
