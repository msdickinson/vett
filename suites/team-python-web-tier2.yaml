  # -----------------------------------------------------------------
  # #6 — Fix off-by-one in a pure Python function (no framework)
  # Analyzer advantage: q1_signature + q2_references shows the shape
  # + callers instantly.
  # -----------------------------------------------------------------
  - id: pw6-pagination-off-by-one
    taxonomy:
      file_count_bucket: "1"
      has_network_io: "no"
      ambiguity_level: "low"
      complexity_tier: "2"
      requires_test_writing: "no"
      touches_state_or_persistence: "no"
      novel_api_vs_known: "known"
      requires_cross_file_changes: "no"
      requires_external_research: "no"
    description: |
      Pagination.page_of computes `[skip:skip+size]` with
      `skip = page*size`, but page is 1-based so it skips one page
      too many. Fix.
    workspace: empty-git-repo
    seed_files:
      requirements.txt: |
        pytest==8.3.3
      pagination.py: |
        from typing import Sequence, List, TypeVar

        T = TypeVar("T")

        def page_of(source: Sequence[T], page: int, size: int) -> List[T]:
            """Return the items on the given 1-based page."""
            if page < 1 or size < 1:
                raise ValueError("page and size must be positive")
            skip = page * size  # BUG: should be (page - 1) * size
            return list(source[skip:skip + size])
      tests/test_pagination.py: |
        from pagination import page_of

        def test_page1_returns_first_chunk():
            assert page_of(list(range(1, 11)), 1, 3) == [1, 2, 3]

        def test_page2_returns_second_chunk():
            assert page_of(list(range(1, 11)), 2, 3) == [4, 5, 6]

        def test_beyond_end_returns_empty():
            assert page_of([1, 2, 3, 4, 5], 4, 3) == []

        def test_invalid_page_raises():
            import pytest
            with pytest.raises(ValueError):
                page_of([1, 2, 3], 0, 2)
    prompt: |
      Use `assign_task` to dispatch an implementer with this task —
      DO NOT do it yourself. Then review and accept_dispatch.

      Implementer's task:

      Fix the off-by-one in `pagination.page_of`. The method comment
      says page is 1-based; the current `skip = page * size` skips
      the first page's items. Change to `(page - 1) * size`. Do not
      change tests. All 4 tests must pass.
    timeout_seconds: 360
    assertions:
      - run_command:
          command: "python -m pip install -q -r requirements.txt && python -m pytest tests/ -q"
          cwd: "."
          timeout_seconds: 120
          exit_code: 0
          stdout_matches: "4 passed"
      - no_event: malformed_tool_call
        max_count: 4
      - budget:
          member_iters_max: 12
          leader_iters_max: 20

  # -----------------------------------------------------------------
  # #7 — Fix a NoneType error before validation
  # Analyzer advantage: q6_provenance shows that a caller may pass None.
  # -----------------------------------------------------------------
  - id: pw7-string-none-handling
    taxonomy:
      file_count_bucket: "1"
      has_network_io: "no"
      ambiguity_level: "low"
      complexity_tier: "2"
      requires_test_writing: "no"
      touches_state_or_persistence: "no"
      novel_api_vs_known: "known"
      requires_cross_file_changes: "no"
      requires_external_research: "no"
    description: |
      truncate() dereferences .strip() before the None check, so
      it throws AttributeError on None. Fix by handling None/empty
      upfront.
    workspace: empty-git-repo
    seed_files:
      requirements.txt: |
        pytest==8.3.3
      helpers.py: |
        def truncate(value: str | None, max_length: int) -> str:
            """Truncate to max_length; return "" if None or empty."""
            if max_length < 0:
                raise ValueError("max_length must be non-negative")
            # BUG: dereferences .strip() BEFORE None check.
            trimmed = value.strip()
            if len(trimmed) <= max_length:
                return trimmed
            return trimmed[:max_length]
      tests/test_helpers.py: |
        import pytest
        from helpers import truncate

        def test_none_returns_empty():
            assert truncate(None, 5) == ""

        def test_empty_returns_empty():
            assert truncate("", 5) == ""

        def test_longer_truncates():
            assert truncate("hello world", 5) == "hello"

        def test_shorter_returns_as_is():
            assert truncate("hi", 10) == "hi"

        def test_negative_raises():
            with pytest.raises(ValueError):
                truncate("x", -1)
    prompt: |
