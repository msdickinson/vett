name: team-python-web-tier2
description: |
  ✅ REPAIRED 2026-08-25. Both arms now run against local Flash on the Sparks.

  ⛔ RETRACTION of the banner this replaces. It said the arms pointed at
  old-gpu-a:8000 "which is dead" and named `aeon-mtp`, "the retired AEON
  Qwen3.6-27B". The old-gpu-a half was WRONG: old-gpu-a was gpu-2's address before the
  2026-08-22 DHCP re-lease — a VACATED ADDRESS, not a dead machine. gpu-2 is
  alive at .100 and serves as TP rank 1 behind gpu-1 at gpu-1. The `aeon-mtp`
  half was right in conclusion but wrong in basis: AEON is switched off, but
  on gpu-1 `aeon-mtp` and `deepseek-v4-flash` both resolved to the SAME
  DeepSeek-V4-Flash-DSpark weights — so the arms were failing on the dead
  ADDRESS, not on the model name.

  What actually changed (all three blockers cleared):
    1. Both arms repointed old-gpu-a -> gpu-1, aeon-mtp -> deepseek-v4-flash.
    2. `coding-team-v2` (the baseline arm) was copied from ~/.vett/profiles/
       into this repo's profiles/ — it existed ONLY in the shared, stale,
       untracked store, so the A/B could not run from a clean checkout.
    3. The A/B is a real comparison again: both arms hit the same endpoint
       and the same weights, and differ only in the analyzer MCP wiring —
       which is the delta this suite exists to measure.

  Still a scoping call for Mark, NOT a repair: whether the
  no-analyzer/analyzer comparison is still wanted at all. The suite is now
  runnable; that is a separate question from whether it should be run.

  Tier-2 Python web-framework task suite. Each instance ships a small
  Django / FastAPI / Flask / pytest project with a specific engineering
  task the implementer must complete. The suite is designed to be run
  twice as an A/B: once with `coding-team-v2` (no analyzer) and once
  with `coding-team-v2-analyzer` (analyzer MCP tools available). Every
  task is chosen so that the analyzer's Q1-Q7 tools have a clear
  advantage — locating a URL handler, tracing a return-shape, finding
  every caller — and the delta between the two profiles is the M5
  acceptance signal.

  Substitute for the "SWE-Verified 20-instance A/B benchmark" per the
  Config B M5 gate — same shape (real Python, real pytest verification),
  fits inside a single tar/checkout instead of the SWE-bench Docker
  ecosystem, and every instance's ground truth is a passing pytest run.

  Run baseline:
    vett team-bench team-python-web-tier2 --profile coding-team-v2 --json > baseline.json
  Run treatment:
    vett team-bench team-python-web-tier2 --profile coding-team-v2-analyzer --json > treatment.json
  A/B report:
    python apps/static-analysis-python/scripts/ab_report.py baseline.json treatment.json

profile: coding-team-v2
tier: 2

# All instances share the same taxonomy shape — Python web framework,
# uses pytest for verification, no network I/O, complexity tier 2.
# Inlined per-instance below (YamlDotNet's suite loader can't resolve
# YAML anchors declared under an unrecognized top-level key).

instances:
  # -----------------------------------------------------------------
  # #1 — Flask: fix a URL pattern typo
  # Analyzer advantage: q7_flask_endpoints instantly shows which route
  # is wrong; without it the implementer has to grep for the wrong
  # pattern.
  # -----------------------------------------------------------------
  - id: pw1-flask-url-typo
    taxonomy:
      file_count_bucket: "1"
      has_network_io: "no"
      ambiguity_level: "low"
      complexity_tier: "2"
      requires_test_writing: "no"
      touches_state_or_persistence: "no"
      novel_api_vs_known: "known"
      requires_cross_file_changes: "no"
      requires_external_research: "no"
    description: |
      Flask app has a URL pattern typo — /helllo instead of /hello.
      The test hits /hello and expects "world". Fix the route.
    workspace: empty-git-repo
    seed_files:
      requirements.txt: |
        flask==3.0.3
        pytest==8.3.3
      app.py: |
        from flask import Flask

        app = Flask(__name__)

        @app.route("/helllo")
        def hello():
            return "world"

        @app.route("/healthz")
        def healthz():
            return "ok"
      tests/test_app.py: |
        from app import app

        def test_hello_route():
            client = app.test_client()
            r = client.get("/hello")
            assert r.status_code == 200
            assert r.data == b"world"

        def test_healthz_still_works():
            client = app.test_client()
            assert client.get("/healthz").status_code == 200
    prompt: |
      Use `assign_task` to dispatch an implementer with this task —
      DO NOT do it yourself. Then review and accept_dispatch.

      Implementer's task:

      The Flask app has a URL pattern typo. `tests/test_app.py`
      hits `/hello` but the app registers `/helllo`. Fix `app.py`.
      Do not change the tests. Both tests must pass.

      Do NOT run pytest yourself; the bench harness verifies.
    timeout_seconds: 360
    assertions:
      - file: app.py
        exists: true
      - run_command:
          command: "python -m pip install -q -r requirements.txt && python -m pytest tests/ -q"
          cwd: "."
          timeout_seconds: 180
