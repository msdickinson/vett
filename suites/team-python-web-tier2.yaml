      requires_external_research: "no"
    description: |
      /version endpoint returns hardcoded "1.0" but test wants it to
      read from `VERSION` module-level constant. Deterministic input,
      no I/O.
    workspace: empty-git-repo
    seed_files:
      requirements.txt: |
        flask==3.0.3
        pytest==8.3.3
      app.py: |
        from flask import Flask

        VERSION = "1.4.2"

        app = Flask(__name__)

        @app.get("/version")
        def version():
            return {"version": "1.0"}  # BUG: hardcoded, should use VERSION
      tests/test_app.py: |
        from app import app, VERSION

        def test_version_from_constant():
            client = app.test_client()
            r = client.get("/version")
            assert r.status_code == 200
            assert r.json == {"version": VERSION}
    prompt: |
      Use `assign_task` to dispatch an implementer with this task —
      DO NOT do it yourself. Then review and accept_dispatch.

      Implementer's task:

      Change `/version` in `app.py` to return the VERSION module
      constant instead of the hardcoded "1.0" string. Test must pass.
    timeout_seconds: 360
    assertions:
      - run_command:
          command: "python -m pip install -q -r requirements.txt && python -m pytest tests/ -q"
          cwd: "."
          timeout_seconds: 180
          exit_code: 0
          stdout_matches: "1 passed"
      - no_event: malformed_tool_call
        max_count: 4
      - budget:
          member_iters_max: 10
          leader_iters_max: 20
