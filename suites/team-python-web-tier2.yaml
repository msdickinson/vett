      DO NOT do it yourself. Then review and accept_dispatch.

      Implementer's task:

      Fix truncate() in `helpers.py`: handle None/empty BEFORE
      dereferencing .strip(). Return "" when value is None or empty.
      Do not change tests. All 5 tests must pass.
