name: spec-authoring-tier0-oneshot
description: |
  T0 — ONE-SHOT variant. Each instance's initial prompt inlines the
  ticket text so the agent doesn't need file_editor to read it, but
  current_spec.json IS seeded to the workspace because the spec_diff
  MCP server reads it from disk (not from the argument stream). Pair
  with profile `spec-authoring-oneshot` which has `tools: []` (only
  spec_diff MCP tools advertised).

  Run:
    vett team-bench spec-authoring-tier0-oneshot --profile spec-authoring-oneshot --json > t0-oneshot.json
  Score Q1 + Q2:
    python spec_q1_report.py t0-oneshot.json

  Sibling: spec-authoring-tier0.yaml (agentic file-reading variant).
  Same 5 pairs, same taxonomy, same ground truth. Only prompt shape
  differs.
profile: spec-authoring-oneshot
tier: 0
instances:
- id: sa-t0-py-01-bump-literal
  taxonomy:
    language: python
    spec_change_kind: modify_leaf_source
    diff_size_bucket: '1'
    pair_id: '01'
  description: |
    bump(x) returns x + 1; should return x + 2. Single-op modify.
  workspace: empty-git-repo
  seed_files:
    current_spec.json: |
      {
        "spec_version": "0.4",
        "target": {"kind":"function","name":"bump",
                   "inputs":[{"name":"x","type":"integer"}],
                   "stateful":false,"state_fields":{}},
        "types": {},
        "return_exits": [
          {"id":"always","when":"always","returns":"integer",
           "leaves":{"value":{"source":"x + 1","determinism":"computed",
                              "depends_on":["x"]}}}
        ],
        "external_calls": []
      }
    .groundtruth/desired_spec.json: |
      {
        "spec_version": "0.4",
        "target": {"kind":"function","name":"bump",
                   "inputs":[{"name":"x","type":"integer"}],
                   "stateful":false,"state_fields":{}},
        "types": {},
        "return_exits": [
          {"id":"always","when":"always","returns":"integer",
           "leaves":{"value":{"source":"x + 2","determinism":"computed",
                              "depends_on":["x"]}}}
        ],
        "external_calls": []
      }
    .groundtruth/desired_diff.json: |
      {"spec_diff_version":"0.1","changes":[
       {"op":"modify","path":"return_exits.always.leaves.value.source",
        "from":"x + 1","to":"x + 2"}
      ]}
  prompt: |
    You are being given a ticket. The current behavioral spec is
    already on disk at `./current_spec.json` in this workspace; the
    `mcp__spec_diff__diff_apply` tool reads it automatically.

    Emit exactly one `mcp__spec_diff__diff_apply` call whose diff
    transforms the current spec into what the ticket asks for. Then
    stop. Use `spec_diff_version: "0.1"`.

    ## Ticket

    # Bug — bump increments by wrong amount

    The `bump(x)` function currently returns `x + 1`. Per the updated
    spec, it should return `x + 2`.

    ## Current spec (for reference; also available on disk)

    ```json
    {
      "spec_version": "0.4",
      "target": {"kind":"function","name":"bump",
                 "inputs":[{"name":"x","type":"integer"}],
                 "stateful":false,"state_fields":{}},
      "types": {},
      "return_exits": [
        {"id":"always","when":"always","returns":"integer",
         "leaves":{"value":{"source":"x + 1","determinism":"computed",
                            "depends_on":["x"]}}}
      ],
      "external_calls": []
    }
    ```
  timeout_seconds: 180
  assertions:
  - tool_call: mcp__spec_diff__diff_apply
    success: true
  - budget:
      leader_iters_max: 5
