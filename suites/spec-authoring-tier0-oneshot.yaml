- id: sa-t0-py-03-divide-zero-check
  taxonomy:
    language: python
    spec_change_kind: add_validation_branch
    diff_size_bucket: '2'
    pair_id: '03'
  description: |
    divide(a, b) crashes when b == 0; should raise invalid_argument.
    One modify + one add_exit.
  workspace: empty-git-repo
  seed_files:
    current_spec.json: |
      {
        "spec_version": "0.4",
        "target": {"kind":"function","name":"divide",
                   "inputs":[{"name":"a","type":"number"},
                             {"name":"b","type":"number"}],
                   "stateful":false,"state_fields":{}},
        "types": {},
        "return_exits": [
          {"id":"always","when":"always","returns":"number",
           "leaves":{"value":{"source":"a / b","determinism":"computed",
                              "depends_on":["a","b"]}}}
        ],
        "external_calls": []
      }
    .groundtruth/desired_spec.json: |
      {
        "spec_version": "0.4",
        "target": {"kind":"function","name":"divide",
                   "inputs":[{"name":"a","type":"number"},
                             {"name":"b","type":"number"}],
                   "stateful":false,"state_fields":{}},
        "types": {},
        "return_exits": [
          {"id":"divide_by_zero","when":"b == 0","returns":"raises",
           "leaves":{"value":{"source":"raise invalid_argument(\"division by zero\")",
                              "determinism":"constant"}}},
          {"id":"always","when":"b != 0","returns":"number",
           "leaves":{"value":{"source":"a / b","determinism":"computed",
                              "depends_on":["a","b"]}}}
        ],
        "external_calls": []
      }
    .groundtruth/desired_diff.json: |
      {"spec_diff_version":"0.1","changes":[
       {"op":"modify","path":"return_exits.always.when",
        "from":"always","to":"b != 0"},
       {"op":"add_exit","at":"before:always","value":{
         "id":"divide_by_zero","when":"b == 0","returns":"raises",
         "leaves":{"value":{"source":"raise invalid_argument(\"division by zero\")",
                            "determinism":"constant"}}}}
      ]}
  prompt: |
    You are being given a ticket. The current behavioral spec is
    already on disk at `./current_spec.json` in this workspace; the
    `mcp__spec_diff__diff_apply` tool reads it automatically.

    Emit exactly one `mcp__spec_diff__diff_apply` call whose diff
    transforms the current spec into what the ticket asks for. Then
    stop. Use `spec_diff_version: "0.1"`.

    ## Ticket

    # Bug — divide crashes on zero divisor

    `divide(a, b)` currently computes `a / b` unconditionally,
    crashing when `b == 0`. Per the spec update, it should raise
    `invalid_argument("division by zero")` when `b == 0`, and return
    `a / b` otherwise.

    ## Current spec (for reference; also available on disk)

    ```json
    {
      "spec_version": "0.4",
      "target": {"kind":"function","name":"divide",
                 "inputs":[{"name":"a","type":"number"},
                           {"name":"b","type":"number"}],
                 "stateful":false,"state_fields":{}},
      "types": {},
      "return_exits": [
        {"id":"always","when":"always","returns":"number",
         "leaves":{"value":{"source":"a / b","determinism":"computed",
                            "depends_on":["a","b"]}}}
      ],
      "external_calls": []
    }
    ```
  timeout_seconds: 180
  assertions:
  - tool_call: mcp__spec_diff__diff_apply
    success: true
  - budget:
      leader_iters_max: 5
