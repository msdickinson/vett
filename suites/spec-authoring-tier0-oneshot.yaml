- id: sa-t0-py-02-age-threshold
  taxonomy:
    language: python
    spec_change_kind: modify_when_condition
    diff_size_bucket: '2'
    pair_id: '02'
  description: |
    is_valid_age(age) uses adult threshold 18; should be 21.
    Two modify ops on when: conditions.
  workspace: empty-git-repo
  seed_files:
    current_spec.json: |
      {
        "spec_version": "0.4",
        "target": {"kind":"function","name":"is_valid_age",
                   "inputs":[{"name":"age","type":"integer"}],
                   "stateful":false,"state_fields":{}},
        "types": {},
        "return_exits": [
          {"id":"pass","when":"age >= 18","returns":"boolean",
           "leaves":{"value":{"source":"true","determinism":"constant"}}},
          {"id":"fail","when":"age < 18","returns":"boolean",
           "leaves":{"value":{"source":"false","determinism":"constant"}}}
        ],
        "external_calls": []
      }
    .groundtruth/desired_spec.json: |
      {
        "spec_version": "0.4",
        "target": {"kind":"function","name":"is_valid_age",
                   "inputs":[{"name":"age","type":"integer"}],
                   "stateful":false,"state_fields":{}},
        "types": {},
        "return_exits": [
          {"id":"pass","when":"age >= 21","returns":"boolean",
           "leaves":{"value":{"source":"true","determinism":"constant"}}},
          {"id":"fail","when":"age < 21","returns":"boolean",
           "leaves":{"value":{"source":"false","determinism":"constant"}}}
        ],
        "external_calls": []
      }
    .groundtruth/desired_diff.json: |
      {"spec_diff_version":"0.1","changes":[
       {"op":"modify","path":"return_exits.pass.when",
        "from":"age >= 18","to":"age >= 21"},
       {"op":"modify","path":"return_exits.fail.when",
        "from":"age < 18","to":"age < 21"}
      ]}
  prompt: |
    You are being given a ticket. The current behavioral spec is
    already on disk at `./current_spec.json` in this workspace; the
    `mcp__spec_diff__diff_apply` tool reads it automatically.

    Emit exactly one `mcp__spec_diff__diff_apply` call whose diff
    transforms the current spec into what the ticket asks for. Then
    stop. Use `spec_diff_version: "0.1"`.

    ## Ticket

    # Bug — is_valid_age uses wrong threshold

    `is_valid_age(age)` currently returns `true` for `age >= 18`.
    The regulatory requirement changed; it should return `true` only
    for `age >= 21`.

    ## Current spec (for reference; also available on disk)

    ```json
    {
      "spec_version": "0.4",
      "target": {"kind":"function","name":"is_valid_age",
                 "inputs":[{"name":"age","type":"integer"}],
                 "stateful":false,"state_fields":{}},
      "types": {},
      "return_exits": [
        {"id":"pass","when":"age >= 18","returns":"boolean",
         "leaves":{"value":{"source":"true","determinism":"constant"}}},
        {"id":"fail","when":"age < 18","returns":"boolean",
         "leaves":{"value":{"source":"false","determinism":"constant"}}}
      ],
      "external_calls": []
    }
    ```
  timeout_seconds: 180
  assertions:
  - tool_call: mcp__spec_diff__diff_apply
    success: true
  - budget:
      leader_iters_max: 5
