- id: sa-t0-py-04-clamp-raise-rename
  taxonomy:
    language: python
    spec_change_kind: rename_exit_change_returns
    diff_size_bucket: '2'
    pair_id: '04'
  description: |
    clamp(x) returns 0 for negatives; should raise invalid_argument.
    Tests the id-immutability rule: must be remove_exit + add_exit,
    NOT modify on `id` (would fail validation).
  workspace: empty-git-repo
  seed_files:
    current_spec.json: |
      {
        "spec_version": "0.4",
        "target": {"kind":"function","name":"clamp",
                   "inputs":[{"name":"x","type":"integer"}],
                   "stateful":false,"state_fields":{}},
        "types": {},
        "return_exits": [
          {"id":"neg_clamp","when":"x < 0","returns":"integer",
           "leaves":{"value":{"source":"0","determinism":"constant"}}},
          {"id":"identity","when":"x >= 0","returns":"integer",
           "leaves":{"value":{"source":"x","determinism":"input",
                              "depends_on":["x"]}}}
        ],
        "external_calls": []
      }
    .groundtruth/desired_spec.json: |
      {
        "spec_version": "0.4",
        "target": {"kind":"function","name":"clamp",
                   "inputs":[{"name":"x","type":"integer"}],
                   "stateful":false,"state_fields":{}},
        "types": {},
        "return_exits": [
          {"id":"raise_neg","when":"x < 0","returns":"raises",
           "leaves":{"value":{"source":"raise invalid_argument(\"negative input\")",
                              "determinism":"constant"}}},
          {"id":"identity","when":"x >= 0","returns":"integer",
           "leaves":{"value":{"source":"x","determinism":"input",
                              "depends_on":["x"]}}}
        ],
        "external_calls": []
      }
    .groundtruth/desired_diff.json: |
      {"spec_diff_version":"0.1","changes":[
       {"op":"remove_exit","path":"return_exits.neg_clamp"},
       {"op":"add_exit","at":"before:identity","value":{
         "id":"raise_neg","when":"x < 0","returns":"raises",
         "leaves":{"value":{"source":"raise invalid_argument(\"negative input\")",
                            "determinism":"constant"}}}}
      ]}
  prompt: |
    You are being given a ticket. The current behavioral spec is
    already on disk at `./current_spec.json` in this workspace; the
    `mcp__spec_diff__diff_apply` tool reads it automatically.

    Emit exactly one `mcp__spec_diff__diff_apply` call whose diff
    transforms the current spec into what the ticket asks for. Then
    stop. Use `spec_diff_version: "0.1"`.

    ## Ticket

    # Bug — clamp swallows negatives instead of erroring

    `clamp(x)` currently returns `0` for any negative `x`. Per the
    spec update, it should raise `invalid_argument("negative input")`
    instead. The non-negative branch is unchanged.

    ## Current spec (for reference; also available on disk)

    ```json
    {
      "spec_version": "0.4",
      "target": {"kind":"function","name":"clamp",
                 "inputs":[{"name":"x","type":"integer"}],
                 "stateful":false,"state_fields":{}},
      "types": {},
      "return_exits": [
        {"id":"neg_clamp","when":"x < 0","returns":"integer",
         "leaves":{"value":{"source":"0","determinism":"constant"}}},
        {"id":"identity","when":"x >= 0","returns":"integer",
         "leaves":{"value":{"source":"x","determinism":"input",
                            "depends_on":["x"]}}}
      ],
      "external_calls": []
    }
    ```
  timeout_seconds: 180
  assertions:
  - tool_call: mcp__spec_diff__diff_apply
    success: true
  - budget:
      leader_iters_max: 5
