      The ten files are completely independent; there is no ordering
      constraint between them. Dispatch a SEPARATE member for EACH file
      so all ten edits happen in parallel rather than sequentially.
      Issue the ten `assign_async` calls together in a single turn.

      When every member reports back, accept their work and confirm all
      ten files are updated.
    timeout_seconds: 1800
    assertions:
      - file: M01.cs
        exists: true
        content_matches: 'public const int SchemaVersion = 2;'
      - file: M02.cs
        exists: true
        content_matches: 'public const int SchemaVersion = 2;'
      - file: M03.cs
        exists: true
        content_matches: 'public const int SchemaVersion = 2;'
      - file: M04.cs
        exists: true
