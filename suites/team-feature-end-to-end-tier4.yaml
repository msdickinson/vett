name: team-feature-end-to-end-tier4
description: |
  A12 — Feature End-to-End. Build a small but complete vertical slice
  (controller → service → repository → response) from a spec, with
  integration tests already in place. The agent must implement ALL
  layers; tests use `WebApplicationFactory<Program>` and only pass when
  every layer is wired correctly.

  This is the TicketForge production target. It's tier 4 because
  there's no half-credit: a partial implementation = compile failure
  or runtime 500s, not "some tests pass".

  Scoped to 4 instances (each is heavy: ~6–12 min wall + 2-project
  solutions). 4 × 3 = 12 runs ≈ 90–120 min wall on single DGX.

  Run: vett team-bench team-feature-end-to-end-tier4

profile: ds-team-flash
tier: 4

instances:
  # ============================================================
  # f1 — GET /users — list users from in-memory repo
  # ============================================================
  - id: f1-list-users
    taxonomy: &a12_tax
      # file_count_bucket counts files the task is EXPECTED TO TOUCH
      # (defaults/taxonomy.yaml). Each f* prompt enumerates exactly six:
      # model, interface, in-memory repo, service, controller, and the
      # TODO-stubbed Api/Program.cs for DI wiring. Was "5-10", a value
      # that has never existed in the schema; the real count is 6, so
      # this bucket goes UP while the am* anchor goes DOWN.
      file_count_bucket: "6+"
      has_network_io: "no"
      ambiguity_level: "low"
      complexity_tier: "4"
      requires_test_writing: "no"
      touches_state_or_persistence: "yes"
      novel_api_vs_known: "known"
      requires_cross_file_changes: "yes"
      requires_external_research: "no"
    description: |
      A12 — Implement GET /users endpoint end-to-end. Need User record,
      IUserRepository, InMemoryUserRepository (seeded), UserService,
      UsersController. Tests assert HTTP 200 + JSON array of users.
    workspace: empty-git-repo
    seed_files:
      Api/Api.csproj: |
        <Project Sdk="Microsoft.NET.Sdk.Web">
          <PropertyGroup>
            <TargetFramework>net10.0</TargetFramework>
            <ImplicitUsings>enable</ImplicitUsings>
            <Nullable>enable</Nullable>
            <IsPackable>false</IsPackable>
            <RootNamespace>Api</RootNamespace>
            <AssemblyName>Api</AssemblyName>
          </PropertyGroup>
        </Project>
      Api/Program.cs: |
        // Agent fills this in: add controllers, register repo + service,
        // map controllers, then app.Run().
        var builder = WebApplication.CreateBuilder(args);
        // TODO: builder.Services...
        var app = builder.Build();
        // TODO: app.MapControllers();
        app.Run();
        public partial class Program { }
      Api.Tests/Api.Tests.csproj: |
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net10.0</TargetFramework>
            <ImplicitUsings>enable</ImplicitUsings>
            <Nullable>enable</Nullable>
            <IsPackable>false</IsPackable>
            <RootNamespace>Api.Tests</RootNamespace>
            <AssemblyName>Api.Tests</AssemblyName>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="Microsoft.NET.Test.Sdk" Version="17.14.1" />
            <PackageReference Include="xunit" Version="2.9.3" />
            <PackageReference Include="xunit.runner.visualstudio" Version="3.1.4" />
            <PackageReference Include="Microsoft.AspNetCore.Mvc.Testing" Version="10.0.0" />
          </ItemGroup>
          <ItemGroup><Using Include="Xunit" /></ItemGroup>
          <ItemGroup>
            <ProjectReference Include="..\Api\Api.csproj" />
          </ItemGroup>
        </Project>
      Api.Tests/Users_Tests.cs: |
        using System.Net;
        using System.Text.Json;
        using Microsoft.AspNetCore.Mvc.Testing;

        namespace Api.Tests;

        public class Users_Tests : IClassFixture<WebApplicationFactory<Program>>
        {
            private readonly WebApplicationFactory<Program> _f;
            public Users_Tests(WebApplicationFactory<Program> f) => _f = f;

            [Fact] public async Task GetUsers_Returns200()
            {
                var resp = await _f.CreateClient().GetAsync("/users");
                Assert.Equal(HttpStatusCode.OK, resp.StatusCode);
            }
            [Fact] public async Task GetUsers_ReturnsJsonArray()
            {
                var body = await _f.CreateClient().GetStringAsync("/users");
                using var doc = JsonDocument.Parse(body);
                Assert.Equal(JsonValueKind.Array, doc.RootElement.ValueKind);
            }
            [Fact] public async Task GetUsers_ContainsSeededUsers()
            {
                var body = await _f.CreateClient().GetStringAsync("/users");
                Assert.Contains("\"alice\"", body, StringComparison.OrdinalIgnoreCase);
                Assert.Contains("\"bob\"", body, StringComparison.OrdinalIgnoreCase);
            }
            [Fact] public async Task GetUsers_ItemHasIdAndName()
            {
                var body = await _f.CreateClient().GetStringAsync("/users");
                using var doc = JsonDocument.Parse(body);
                var first = doc.RootElement.EnumerateArray().First();
                Assert.True(first.TryGetProperty("id", out _) || first.TryGetProperty("Id", out _));
                Assert.True(first.TryGetProperty("name", out _) || first.TryGetProperty("Name", out _));
            }
        }
    prompt: |
      Implement a GET /users endpoint end-to-end. Build all the layers:
        - `User.cs` (Api/User.cs): record with `Id` (int) and `Name` (string)
        - `IUserRepository.cs`: `IEnumerable<User> GetAll()`
        - `InMemoryUserRepository.cs`: seeded with at least
          `new User(1, "Alice")` and `new User(2, "Bob")`
        - `UserService.cs`: wraps the repo with `IEnumerable<User> ListAll()`
        - `UsersController.cs`: `[ApiController]`, `[Route("users")]`,
          `[HttpGet]` returning `service.ListAll()`
        - `Program.cs`: register controllers + service + repo in DI,
          `app.MapControllers()`, build/run.

      Tests use `WebApplicationFactory<Program>` and assert JSON array
      with at least "alice" + "bob".

      Dispatch one implementer. Accept_dispatch.
    timeout_seconds: 1800
    assertions:
      - dotnet_test:
          cwd: "Api.Tests"
          timeout_seconds: 900
          min_passed: 4
          max_failed: 0
      - no_event: malformed_tool_call
        max_count: 3
      - budget:
          member_iters_max: 60
          leader_iters_max: 28

