          <ItemGroup>
            <PackageReference Include="Microsoft.NET.Test.Sdk" Version="17.14.1" />
            <PackageReference Include="xunit" Version="2.9.3" />
            <PackageReference Include="xunit.runner.visualstudio" Version="3.1.4" />
            <PackageReference Include="Microsoft.AspNetCore.Mvc.Testing" Version="10.0.0" />
          </ItemGroup>
          <ItemGroup><Using Include="Xunit" /></ItemGroup>
          <ItemGroup>
            <ProjectReference Include="..\Api\Api.csproj" />
          </ItemGroup>
        </Project>
      Api.Tests/Orders_Tests.cs: |
        using System.Net;
        using System.Text.Json;
        using Microsoft.AspNetCore.Mvc.Testing;

        namespace Api.Tests;

        public class Orders_Tests : IClassFixture<WebApplicationFactory<Program>>
        {
            private readonly WebApplicationFactory<Program> _f;
            public Orders_Tests(WebApplicationFactory<Program> f) => _f = f;

            [Fact] public async Task GetOrders_KnownCustomer_Returns200()
            {
                var resp = await _f.CreateClient().GetAsync("/orders?customer=1");
                Assert.Equal(HttpStatusCode.OK, resp.StatusCode);
            }
            [Fact] public async Task GetOrders_KnownCustomer_ReturnsFilteredOnly()
            {
                var body = await _f.CreateClient().GetStringAsync("/orders?customer=1");
                using var doc = JsonDocument.Parse(body);
                Assert.True(doc.RootElement.GetArrayLength() >= 1);
                foreach (var item in doc.RootElement.EnumerateArray())
                {
                    var cust = item.TryGetProperty("customerId", out var c1) ? c1
                             : item.TryGetProperty("CustomerId", out var c2) ? c2
                             : default;
                    Assert.Equal(1, cust.GetInt32());
                }
            }
            [Fact] public async Task GetOrders_UnknownCustomer_Returns200EmptyArray()
            {
                var resp = await _f.CreateClient().GetAsync("/orders?customer=999");
                Assert.Equal(HttpStatusCode.OK, resp.StatusCode);
                var body = await resp.Content.ReadAsStringAsync();
                using var doc = JsonDocument.Parse(body);
                Assert.Equal(0, doc.RootElement.GetArrayLength());
            }
            [Fact] public async Task GetOrders_NoQuery_Returns400()
            {
                var resp = await _f.CreateClient().GetAsync("/orders");
                Assert.Equal(HttpStatusCode.BadRequest, resp.StatusCode);
            }
        }
    prompt: |
      Implement GET /orders?customer={id} end-to-end.
        - `Order.cs`: record with `Id` (int), `CustomerId` (int), `Total` (decimal).
        - `IOrderRepository.cs`: `IEnumerable<Order> GetByCustomer(int customerId)`.
        - `InMemoryOrderRepository.cs`: seed several orders for customer
          1 and customer 2 (at least 1 order for each).
        - `OrderService.cs`: wraps the repo's `GetByCustomer`.
        - `OrdersController.cs`: `[Route("orders")]`, `[HttpGet]`,
          accepts `[FromQuery] int? customer`. If null/missing return
          400. Otherwise return service.ListForCustomer(customer).
        - `Program.cs`: full DI wiring + map controllers.

      4 tests must pass.

      Dispatch one implementer. Accept_dispatch.
    timeout_seconds: 1800
    assertions:
      - dotnet_test:
          cwd: "Api.Tests"
          timeout_seconds: 900
          min_passed: 4
          max_failed: 0
      - no_event: malformed_tool_call
        max_count: 3
      - budget:
          member_iters_max: 70
          leader_iters_max: 28

