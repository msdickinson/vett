        - `IProductRepository.cs`: `Product? Find(int id)`, `void Save(Product p)`.
        - `InMemoryProductRepository.cs`: seed product Id=1 with some price.
        - `ProductService.cs`: `UpdatePriceResult UpdatePrice(int id, decimal price)`
