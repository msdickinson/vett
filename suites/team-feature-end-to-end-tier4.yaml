      Api.Tests/Products_Tests.cs: |
        using System.Net;
        using System.Net.Http.Json;
        using Microsoft.AspNetCore.Mvc.Testing;

        namespace Api.Tests;

        public class Products_Tests : IClassFixture<WebApplicationFactory<Program>>
        {
            private readonly WebApplicationFactory<Program> _f;
            public Products_Tests(WebApplicationFactory<Program> f) => _f = f;

            [Fact] public async Task Put_KnownProduct_Returns200()
            {
                var resp = await _f.CreateClient().PutAsJsonAsync("/products/1/price",
                    new { price = 9.99m });
                Assert.Equal(HttpStatusCode.OK, resp.StatusCode);
            }
            [Fact] public async Task Put_UnknownProduct_Returns404()
            {
                var resp = await _f.CreateClient().PutAsJsonAsync("/products/999/price",
                    new { price = 9.99m });
                Assert.Equal(HttpStatusCode.NotFound, resp.StatusCode);
            }
            [Fact] public async Task Put_ZeroPrice_Returns400()
            {
                var resp = await _f.CreateClient().PutAsJsonAsync("/products/1/price",
                    new { price = 0m });
                Assert.Equal(HttpStatusCode.BadRequest, resp.StatusCode);
            }
            [Fact] public async Task Put_NegativePrice_Returns400()
            {
                var resp = await _f.CreateClient().PutAsJsonAsync("/products/1/price",
                    new { price = -1m });
                Assert.Equal(HttpStatusCode.BadRequest, resp.StatusCode);
            }
            [Fact] public async Task Get_AfterPut_ReflectsNewPrice()
            {
                var client = _f.CreateClient();
                await client.PutAsJsonAsync("/products/1/price", new { price = 42m });
                var body = await client.GetStringAsync("/products/1");
                Assert.Contains("42", body);
            }
        }
