            <ProjectReference Include="..\Api\Api.csproj" />
          </ItemGroup>
        </Project>
      Api.Tests/Todos_Tests.cs: |
        using System.Net;
        using System.Net.Http.Json;
        using System.Text.Json;
        using Microsoft.AspNetCore.Mvc.Testing;

        namespace Api.Tests;

        public class Todos_Tests : IClassFixture<WebApplicationFactory<Program>>
        {
            private readonly WebApplicationFactory<Program> _f;
            public Todos_Tests(WebApplicationFactory<Program> f) => _f = f;

            [Fact] public async Task PostTodo_Valid_Returns201()
            {
                var resp = await _f.CreateClient().PostAsJsonAsync("/todos",
                    new { title = "Buy milk" });
                Assert.Equal(HttpStatusCode.Created, resp.StatusCode);
            }
            [Fact] public async Task PostTodo_Valid_ReturnsBody()
            {
                var resp = await _f.CreateClient().PostAsJsonAsync("/todos",
                    new { title = "Buy milk" });
                var body = await resp.Content.ReadAsStringAsync();
                Assert.Contains("Buy milk", body);
            }
            [Fact] public async Task PostTodo_EmptyTitle_Returns400()
            {
                var resp = await _f.CreateClient().PostAsJsonAsync("/todos",
                    new { title = "" });
                Assert.Equal(HttpStatusCode.BadRequest, resp.StatusCode);
            }
            [Fact] public async Task PostTodo_MissingTitle_Returns400()
            {
                var resp = await _f.CreateClient().PostAsJsonAsync("/todos",
                    new { other = "value" });
                Assert.Equal(HttpStatusCode.BadRequest, resp.StatusCode);
            }
            [Fact] public async Task PostTodo_ResponseHasId()
            {
                var resp = await _f.CreateClient().PostAsJsonAsync("/todos",
                    new { title = "Item" });
                var body = await resp.Content.ReadAsStringAsync();
                using var doc = JsonDocument.Parse(body);
                Assert.True(doc.RootElement.TryGetProperty("id", out _) ||
                            doc.RootElement.TryGetProperty("Id", out _));
            }
        }
    prompt: |
      Implement POST /todos end-to-end.
        - `Todo.cs`: class/record with `Id` (int) and `Title` (string).
        - `ITodoRepository.cs`: `Todo Add(Todo todo)`; assigns Id and stores.
        - `InMemoryTodoRepository.cs`: increments id starting at 1.
        - `TodoService.cs`: `Todo? Create(string? title)` — returns null
          if title is null/empty/whitespace, otherwise stores & returns.
        - `TodosController.cs`: `[Route("todos")]`, `[HttpPost]`. Reads
          a body with a `title` property; if title is missing/empty
          returns 400; otherwise returns 201 with the created Todo as JSON.
        - `Program.cs`: register controllers + service + repo, map controllers.

      Tests send JSON `{"title":"..."}`. 5 tests must pass.

      Dispatch one implementer. Accept_dispatch.
