      BUILD.md: |
        # Cycle-Arena — Build Spec (one-shot)
        
        This document is the complete build specification for Cycle-Arena. The agent should read this file in full and build the entire system in one dispatch, then report results. Do NOT check in mid-way.
        
        ## Vision
        
        Multiplayer real-time light-cycle game. 4 players per arena ride bikes that leave a glowing wall behind them; they die if they hit any wall (their own, another bike's, or the arena boundary). Last bike alive wins. Default camera looks straight down (so it LOOKS like a classic 2D light-cycle game); user can tilt the camera with mouse drag (0°–60° from vertical) to reveal that the world is fully 3D — bikes and walls are extruded geometry. The tilt-reveal is the visual differentiator.
        
        ## Tech stack (non-negotiable)
        
        | Layer | Choice |
        |---|---|
        | Server | ASP.NET Core 10 + SignalR |
        | Client | Babylon.js 8 in vanilla TypeScript + Vite (no React/Vue) |
        | Persistence | PostgreSQL on the runner box (host old-runner, port 5437, database `cycles`, user/password from env vars) |
        | Live game state | In-memory on server (NOT in Postgres) |
        | Hosting | Docker on the runner box via docker-compose |
        | Auth | None for v0 — anonymous play with guest display names |
        | Solution file | `.slnx` (NOT `.sln`) |
        | Folder names | lowercase-hyphenated |
        | Project names | PascalCase in .NET csproj |
        | Project subfolders | `src/`, `tests/`, `docs/` |
        | Tick rate | 20Hz simulation. 20Hz full-state broadcast (no delta state v0) |
        | Architecture | Server-authoritative (no client prediction in v0) |
        
        ## Solution layout (exact)
        
        ```
        games/cycle-arena/
        ├── Cycles.slnx
        ├── Dockerfile
        ├── docker-compose.yml
        ├── src/
        │   └── Cycles.Server/             # ASP.NET Core 10
        ├── tests/
        │   └── Cycles.Server.Tests/       # xUnit
        └── web/
            └── Cycles.Web/                # TypeScript + Vite + Babylon.js
        ```
        
        ## Domain model
        
        Integer grid (NOT floating point). Bikes turn 90° only (4 directions: N/E/S/W). Bikes advance 1 cell per tick. Arena is 100×100 cells.
        
        ```csharp
        public sealed class GameSession {
            Guid Id;
            ArenaConfig Arena;
            IReadOnlyList<Player> Players;   // exactly 4
            SessionState State;              // Lobby | Countdown | Round | Break | Ended
        }
        
        public sealed class Player {
            Guid Id;
            string DisplayName;
            PlayerKind Kind;                 // Human | AiBot
            Color TrailColor;                // persistent per player (anonymous-but-stable)
            string? ConnectionId;            // null for AI
        }
        
        public sealed class Bike {
            Guid PlayerId;
            GridPosition Position;
            Direction Facing;
            bool IsAlive;
        }
        
        public sealed class Wall {
            Guid OwnerPlayerId;
            IReadOnlyList<GridPosition> Cells;
        }
        
        public sealed class Arena {
            int Width;
            int Height;
            IReadOnlyList<Wall> Walls;
        }
        ```
        
        ## SignalR messages
        
        ### Client → Server
        
        | Method | Args |
        |---|---|
        | `JoinLobby` | `{displayName}` |
        | `SubmitInput` | `{sessionId, turn: "Left" \| "Right" \| "None"}` |
        | `LeaveSession` | `{sessionId}` |
        
        ### Server → Client
        
        | Method | Args | Rate |
        |---|---|---|
        | `LobbyState` | `{playersInLobby, sessionsRunning, yourEta}` | 1Hz to lobby members |
        | `SessionAssigned` | `{sessionId, players, arena, yourPlayerId}` | on match |
        | `CountdownTick` | `{sessionId, secondsRemaining}` | 3-2-1-GO before round |
        | `GameState` | `{sessionId, tick, bikes[], newWallCells[], deaths[]}` | 20Hz during round |
        | `RoundEnded` | `{sessionId, winner?, scoreboard, breakSecondsRemaining}` | on round end |
        | `SessionEnded` | `{sessionId, finalScoreboard}` | on session dispose |
        
        ## Session lifecycle
        
        ```
        [Lobby] → [Countdown 3s] → [Round] → [Break 10s + scoreboard] → [Ended; session disposed]
        ```
        
        **ONE round per session.** After the break, the session disposes. Player sees a "Play again" button; clicking re-joins the lobby queue. **NO auto-requeue. NO best-of-N matches.** Players stay in control of their time.
        
        **Round end:** 1 bike alive OR all dead OR 60 seconds elapsed (timeout = draw, no winner).
        
        ## Matchmaking (public lobby only)
        
        `GameSessionManager`:
        - FIFO lobby queue
        - Every 3 seconds OR on new join, try to fill a session:
          - If lobby has ≥4 humans → start session with 4 humans
          - If lobby has 1–3 humans AND no new join in last 5s → fill with AI bots to 4
          - If 0 humans → no session
        - Sessions run in parallel, each in its own SignalR group `session-{guid}`
        - No hard cap on concurrent sessions
        - **No private rooms. No room codes.**
        
        ## AI bot (medium difficulty, deterministic)
        
        Per tick, decide turn:
        1. Look 1 cell ahead in current direction. If empty → continue straight.
        2. If blocked → flood-fill the open area to LEFT and to RIGHT. Choose the side with the larger open area. If equal, continue straight (no jitter).
        3. If all sides blocked → continue straight (die).
        
        No deeper lookahead. Beatable by an attentive human.
        
        ## Camera + visuals
        
        **Default camera:** orthographic, straight down at XZ floor plane (looks like a 2D light-cycle game at first glance).
        
        **Tilt:** mouse drag (desktop) or two-finger drag (touch) tilts camera 0°–60° from vertical. Reveals 3D: blocky bike models, 1-unit-tall emissive wall ribbons, glowing wireframe arena boundary.
        
        **Style:** dark floor with subtle neon grid (1-unit cells), emissive bike + wall colors matching player's TrailColor, bloom post-process on. Death = brief explosion particle + bike fades out.
        
        **Persistent TrailColor:** anonymous-but-stable, keyed off `DisplayName` + a stable client ID stored in `localStorage`.
        
        ## Acceptance — ALL must pass
        
        ### Build + run
        
        - `dotnet build` of `Cycles.slnx` exits 0
        - `dotnet test` exits 0 with **≥15 simulation tests passing**
        - `docker compose up` brings server up on port 5300
        - `curl localhost:5300/health` returns 200
        - `npm run dev` in `web/Cycles.Web/` serves the client
        - Browser at http://localhost:5173 can: join lobby → get matched (with bots filling) → play one round → see "Play again" button after break
        
        ### Test coverage — simulation library
        
        - collision with own wall
        - collision with another bike's wall
        - collision with arena boundary
        - head-on collision (both die)
        - 4-bike free-for-all completes
        - round-end detection: 1 alive, all dead, 60s timeout
        - AI bot deterministic behavior
        
        ### Test coverage — integration (SignalR TestServer)
        
        - 4 mock SignalR clients join lobby, get matched, advance one round to `RoundEnded`
        - Multiple sessions can run in parallel (8 mock clients → 2 sessions)
        - Player joining when lobby has 1–3 humans + 5s idle → AI bots fill the session
        
        ### Persistence
        
        - Match results persist to Postgres on the runner box:5437
        - Per-player TrailColor is stable across sessions (same `DisplayName` + clientId → same color)
        
        ## Out of scope for v0
        
        Player accounts/auth, mobile native client, custom arena layouts, power-ups, weapons, jump, spectator mode, cosmetics, private rooms, room codes, replay system, client prediction, delta state, best-of-N matches.
        
