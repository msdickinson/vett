      requires_cross_file_changes: "yes"
      requires_external_research: "no"
    description: Blocks 2P online HTML game w/ AI bot fallback
    workspace: empty-git-repo
    seed_files:
      BUILD.md: |
        # Blocks-2P — Build Spec (one-shot)
        
        This document is the complete build specification. The agent should read it in full and build the entire system in one dispatch, then report results. Do NOT check in mid-way.
        
        ## Vision
        
        Two-player online Blocks. Classic gameplay: pieces fall, rotate, lock; clear lines; game speed increases. Multiplayer twist: clearing 2+ lines at once sends "garbage" rows to the opponent's stack. Last player standing wins.
        
        If only one human joins, an AI bot fills the second seat so you can always play. Bot is simple but plays the game (avoids losing, places pieces sensibly).
        
        ## Tech stack (non-negotiable)
        
        | Layer | Choice |
        |---|---|
        | Server | ASP.NET Core 10 + SignalR |
        | Client | Vanilla TypeScript + Vite + HTML5 Canvas (no React/Vue, no Babylon) |
        | Live game state | In-memory on server (server-authoritative) |
        | Persistence | None for v0 — no match history, no accounts |
        | Hosting | Docker on the runner box via docker-compose |
        | Auth | None — anonymous play with guest display name |
        | Solution file | `.slnx` (NOT `.sln`) |
        | Folder names | lowercase-hyphenated |
        | Project names | PascalCase in .NET csproj |
        | Project subfolders | `src/`, `tests/`, `docs/` |
        | Tick rate | Server simulates at the piece-gravity rate (~1Hz per row falling, scaling with level). Broadcasts state-deltas on every state change. |
        
        ## Solution layout (exact)
        
        ```
        games/blocks-2p/
        ├── Blocks.slnx
        ├── Dockerfile
        ├── docker-compose.yml
        ├── src/
        │   └── Blocks.Server/                  # ASP.NET Core 10
        ├── tests/
        │   └── Blocks.Server.Tests/            # xUnit
        └── web/
            └── Blocks.Web/                     # TypeScript + Vite + Canvas
        ```
        
        ## Domain model
        
        ```csharp
        public sealed class GameSession {
            Guid Id;
            IReadOnlyList<Player> Players;            // exactly 2
            IReadOnlyDictionary<Guid, Board> Boards;  // keyed by playerId
            SessionState State;                       // Lobby | Countdown | Playing | Ended
        }
        
        public sealed class Player {
            Guid Id;
            string DisplayName;
            PlayerKind Kind;                          // Human | AiBot
            string? ConnectionId;
        }
        
        public sealed class Board {
            int Width = 10;
            int Height = 20;
            Cell[,] Grid;                             // 0 = empty, 1+ = piece-color-id
            Piece? Active;                            // currently-falling piece (null between locks)
            Piece NextPreview;
            int Score;
            int Level;                                // increases every 10 lines cleared
            int LinesCleared;
            bool IsGameOver;
            int PendingGarbageRows;                   // sent by opponent, applied next lock
        }
        
        public sealed class Piece {
            PieceType Type;                           // I, O, T, S, Z, L, J
            int X, Y;                                 // top-left of bounding box, in grid cells
            int Rotation;                             // 0..3
        }
        ```
        
        ## SignalR messages
        
        ### Client → Server
        
        | Method | Args | Purpose |
        |---|---|---|
        | `JoinLobby` | `{displayName}` | Join queue; matched when 2 humans (or 1 human + 5s idle → bot fills) |
        | `SubmitInput` | `{sessionId, action: "MoveLeft" \| "MoveRight" \| "RotateCW" \| "SoftDrop" \| "HardDrop"}` | Player input; server validates + applies |
        | `LeaveSession` | `{sessionId}` | Voluntary exit; bot replaces |
        
        ### Server → Client
        
        | Method | Args | Rate |
        |---|---|---|
        | `LobbyState` | `{playersInLobby}` | 1Hz to lobby |
        | `SessionAssigned` | `{sessionId, players, yourPlayerId}` | on match |
        | `CountdownTick` | `{sessionId, secondsRemaining}` | 3-2-1-GO before play |
        | `BoardState` | `{sessionId, boards: {playerId: BoardSnapshot}}` | on every state change (piece move/lock/clear/garbage) |
        | `GameEnded` | `{sessionId, winner?, scoreboard}` | on round end (one player tops out) |
        
        ## Game rules (concrete)
        
        - Board: 10 wide × 20 tall. Spawn pieces at column 3-4 of row 0.
        - Pieces: 7 standard tetrominoes (I, O, T, S, Z, L, J), random bag (7-bag randomizer).
        - Gravity: starts at 1 row/sec; speeds up by ×1.5 every 10 lines cleared, capped at 10 rows/sec.
        - Locking: piece locks when it can't fall further (soft delay is OK but not required — instant lock is acceptable for v0).
        - Line clear: full rows clear; pieces above shift down.
        - Scoring: 100 points per line, ×combo multiplier when clearing multiple rows in one lock (1=100, 2=300, 3=500, 4=800).
        - **Garbage system: clearing 2+ rows sends garbage to opponent.** Garbage = solid rows with one random gap per row. Rows sent = (rows cleared − 1). So clearing 4 (blocks) sends 3 rows.
        - Garbage applies on opponent's NEXT piece lock — rises from the bottom of their board.
        - Game over: a piece spawns colliding with existing blocks.
        
        ## AI bot (simple but plays)
        
        Per piece spawn, the bot chooses (rotation, column) by simulating all combinations and scoring each by:
        
        ```
        score = (lines_cleared * 100) - (resulting_max_height * 5) - (holes * 10) - (bumpiness * 2)
        ```
        
        - `holes` = empty cells beneath any filled cell in the same column
        - `bumpiness` = sum of |height_col[i] - height_col[i+1]|
        
        Pick the highest-scoring placement. Move + rotate to that placement (server can fast-forward bot moves, no need to animate). This is the classic "Pierre Dellacherie" heuristic — well-documented online, simple to implement, beatable by a focused human.
        
        ## Matchmaking
        
        - FIFO lobby queue
        - On new join OR every 3s: if 2 humans in queue → start session. If 1 human + 5s stable → start session, fill with bot.
        
        ## Camera + visuals
        
        Two boards side by side. Each board: 200px wide × 400px tall canvas (10×20 cells, 20px each). Player's own board on left, opponent on right.
        
        Above each board: display name, score, lines cleared, level. Below: small "next piece" preview.
        
        Color the 7 piece types differently (the usual falling-block colors: I=cyan, O=yellow, T=purple, S=green, Z=red, L=orange, J=blue).
        
        Garbage rows render as grey.
        
        Input: arrow keys (left/right move, up rotate, down soft drop, space hard drop).
        
        ## Acceptance — ALL must pass
        
        ### Build + run
        - `dotnet build` of `Blocks.slnx` exits 0
        - `dotnet test` exits 0 with ≥10 simulation tests passing
        - `docker compose up` brings server up on port 5310
        - `curl localhost:5310/health` returns 200
        - `npm run dev` in `web/Blocks.Web/` serves the client
        - Browser at http://localhost:5173 can: join lobby → get matched (with bot filling) → play one game → see "Game Over" screen with winner
        
        ### Test coverage — simulation library
        
        - 7-bag randomizer returns each piece type at least once per 7 spawns
        - Piece moves left/right within bounds, blocked at walls
        - Piece rotation respects bounds (no wall-kick required for v0)
        - Piece locks when it can't fall further
        - Full row clears, pieces above shift down
        - Combo scoring (1, 2, 3, 4 lines)
        - Garbage rows applied (3 rows from a 4-line clear)
        - Game-over detection (piece spawns into existing block)
        - AI bot returns a valid placement for an empty board
        
        ### Test coverage — integration (SignalR TestServer)
        
        - 2 mock SignalR clients join lobby, get matched, both receive SessionAssigned
        - Player + bot session: bot plays autonomously, game ends with a winner
        
        ## Out of scope for v0
        
        Accounts, persistence, leaderboards, custom controls, mobile touch UI, replay, spectators, cosmetics, sound effects (silent game is OK), private rooms, room codes, T-spin scoring, wall-kicks, hold piece, B2B bonuses.
        
        ## Report format (when done)
        
        When the implementer finishes, report:
        1. **What was built** — file list
        2. **What tests pass** — output of `dotnet test`
        3. **End-to-end works?** — does `docker compose up` + browser flow complete a game?
        4. **Broken or incomplete?** — what's not working, with specificity
    prompt: |
      Read BUILD.md in this workspace in full — it is the
      complete spec for the system you must build. Build
      everything specified directly in this workspace root
      (ignore any `games/<name>/` prefix in BUILD.md — that
      prefix refers to where the spec was authored; for this
      task your workspace IS that root).

      Dispatch implementers as needed; you may break the
      work into multiple dispatches if scope demands. Aim to
      complete every acceptance criterion in BUILD.md.
      When done, report per the 'Report format' section of
      BUILD.md.
    # 2026-08-24: was 3600. MEASURED: 5 of 6 tier6 runs landed in a 200s band
    # AT OR OVER the 3600s cap (3505/3671/3673/3695/3706s) => the endpoint was
    # SATURATED and had zero power; a cap every run hits measures the cap.
    # armA-run2 was at 8/8 assertions when the clock killed it, 106s over.
    # Raised WITH the implementer max_iterations 40->100 change, which makes
    # runs longer by design; without this the other change is untestable.
    # PREREG: if runs still saturate at 7200 the cap was NOT the constraint and
    # this is reverted -- see PREREG-2026-08-24-cap-repair.md.
    timeout_seconds: 7200   # 120 min hard cap
    assertions:
      - file: Blocks.slnx
        exists: true
      - file: Dockerfile
        exists: true
      - file: docker-compose.yml
        exists: true
      # --- ruler v2: BUILD.md "Acceptance / Build + run", verbatim ---
      # "`dotnet build` of `Blocks.slnx` exits 0"
      - run_command:
          command: dotnet build Blocks.slnx --nologo -v quiet
          exit_code: 0
          timeout_seconds: 600
      # "`dotnet test` exits 0 with >=10 simulation tests passing"
      # min_passed also rejects the empty-test-project failure mode
      # (g2 shipped a Tests.csproj containing zero test .cs files).
      - dotnet_test:
          min_passed: 10
          max_failed: 0
          timeout_seconds: 900
      # "`npm run dev` in `web/Blocks.Web/` serves the client" — we
      # assert the client COMPILES (tsc+vite build), the hermetic half.
      #
      # TWO TRAPS, both hit and fixed on 2026-08-24. Do not "simplify"
      # this line back into either of them:
      #  1. NOT the `cwd:` field. cwd goes to ProcessStartInfo.Working-
      #     Directory, which THROWS Win32Exception out of the whole bench
      #     run when the agent never created web/ — the common failure.
      #  2. NOT `npm --prefix X install`. --prefix sets the install
      #     TARGET, not the manifest location: npm reads ./package.json,
      #     doesn't find one, and dies ENOENT (exit -4058) with EMPTY
      #     output even on a perfect artifact. (`--prefix X run` does
      #     work, which is what made this look correct at first.)
      # `cd` inside the command works in both cmd.exe and bash and
      # short-circuits to a clean nonzero when the dir is missing.
      # Verified two-sided: exit 0 on a real client, exit 1 + diagnostic
      # on the EMPTY web/Blocks.Web/ the Flash run actually shipped.
      - run_command:
          command: cd web/Blocks.Web && npm install --no-audit --no-fund && npm run build
          exit_code: 0
          timeout_seconds: 900
      - no_event: malformed_tool_call
        max_count: 10
      - budget:
          member_iters_max: 80
          leader_iters_max: 40

