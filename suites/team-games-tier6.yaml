name: team-games-tier6
description: |
  Tier 6: full-system one-shot game builds. Each instance ships a
  BUILD.md spec in the workspace; agent must build the entire
  system per the spec in a single dispatch.

  ⚠ RULER v2 (2026-08-24). This suite previously asserted ONLY
  `exists: true` on three files. That gate passed code that does
  not compile: on 2026-08-24 two paid runs of g1 were scored PASS,
  and re-grading by hand found one of them had 3x CS1061 in
  IntegrationTests.cs, a TypeScript client that failed tsc, and a
  Dockerfile that never built the client at all. A third run
  (g3-cycle) cleared all three existence assertions while shipping
  ZERO browser-client code.
  ⭐ A GREEN RESULT ON AN UNINSPECTED VERIFIER IS NOT EVIDENCE.

  The build/test assertions below are NOT new requirements — they
  are transcribed verbatim from each instance's own BUILD.md
  "Acceptance — ALL must pass" section (g1/g2: `dotnet build`
  exits 0 + `dotnet test` >=10 passing; g3: >=15 passing). The
  spec always demanded them; only the gate failed to check.
  The original "too big to assert via xUnit / many parts are
  visual" rationale justifies not asserting BROWSER GAMEPLAY. It
  never justified skipping the compiler.

  ⛔ NEVER POOL v1-graded and v2-graded runs — different
  instruments on the same artifacts. Runs before 2026-08-24 were
  scored under v1. Expect v2 to be materially harder; that is the
  point, and a resulting drop in pass rate is a corrected
  measurement, not a regression.
  ⚠ STILL UNMEASURED even under v2: the container is never built
  or started, and the game is never played. `docker compose up`
  and the browser flow remain manual-review only.

  Run: vett team-bench team-games-tier6

