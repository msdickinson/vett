    timeout_seconds: 7200   # 120 min hard cap
    assertions:
      - file: PanelMatch.slnx
        exists: true
      - file: Dockerfile
        exists: true
      - file: docker-compose.yml
        exists: true
      # --- ruler v2: BUILD.md "Acceptance / Build + run", verbatim ---
      # "`dotnet build` of `PanelMatch.slnx` exits 0"
      - run_command:
          command: dotnet build PanelMatch.slnx --nologo -v quiet
          exit_code: 0
          timeout_seconds: 600
      # "`dotnet test` exits 0 with >=10 simulation tests passing"
      - dotnet_test:
          min_passed: 10
          max_failed: 0
          timeout_seconds: 900
      # "`npm run dev` in `web/PanelMatch.Web/` serves the client" — we
