    description: Panel-de-Pon-style 2P puzzle game w/ AI bot fallback
    workspace: empty-git-repo
    seed_files:
      BUILD.md: |
        # Panel-Match-2P — Build Spec (one-shot)
        
        This document is the complete build specification. Read it in full and build the entire system in one dispatch. Do NOT check in mid-way.
        
        ## Vision
        
        Two-player online puzzle game in the classic swap-and-match block puzzle genre. Grid of colored blocks rises slowly from below; player swaps adjacent blocks with a 2-cell-wide cursor; matching 3+ same-colored blocks in a row OR column clears them; cleared blocks above fall and can trigger CHAINS (combos). Chains send garbage rows to your opponent. Lose when blocks reach the top.
        
        If only one human joins, AI bot fills second seat.
        
        ## Tech stack (non-negotiable)
        
        | Layer | Choice |
        |---|---|
        | Server | ASP.NET Core 10 + SignalR |
        | Client | Vanilla TypeScript + Vite + HTML5 Canvas |
        | Live game state | In-memory server-authoritative |
        | Persistence | None for v0 |
        | Hosting | Docker on the runner box via docker-compose |
        | Auth | None — anonymous play with guest display name |
        | Solution file | `.slnx` |
        | Folder naming | lowercase-hyphenated; PascalCase only inside csproj |
        
        ## Solution layout (exact)
        
        ```
        games/panel-match-2p/
        ├── PanelMatch.slnx
        ├── Dockerfile
        ├── docker-compose.yml
        ├── src/
        │   └── PanelMatch.Server/              # ASP.NET Core 10
        ├── tests/
        │   └── PanelMatch.Server.Tests/        # xUnit
        └── web/
            └── PanelMatch.Web/                 # TypeScript + Vite + Canvas
        ```
        
        ## Domain model
        
        ```csharp
        public sealed class GameSession {
            Guid Id;
            IReadOnlyList<Player> Players;            // exactly 2
            IReadOnlyDictionary<Guid, Board> Boards;
            SessionState State;                       // Lobby | Countdown | Playing | Ended
        }
        
        public sealed class Board {
            int Width = 6;
            int Height = 12;
            // Grid: 0 = empty, 1-5 = block color id, 6 = garbage
            Cell[,] Grid;
            CursorPos Cursor;                         // 2-cell-wide cursor; tracks left cell
            float RiseProgress;                       // 0..1; when 1.0, push new row from bottom
            int Score;
            int CurrentChainLength;                   // running chain depth from last clear
            bool IsGameOver;
            int PendingGarbageRows;                   // queued from opponent, applied between rises
        }
        
        public sealed class Player {
            Guid Id;
            string DisplayName;
            PlayerKind Kind;                          // Human | AiBot
            string? ConnectionId;
        }
        ```
        
        ## SignalR messages
        
        ### Client → Server
        
        | Method | Args | Purpose |
        |---|---|---|
        | `JoinLobby` | `{displayName}` | Join queue |
        | `SubmitInput` | `{sessionId, action: "MoveLeft" \| "MoveRight" \| "MoveUp" \| "MoveDown" \| "Swap" \| "ForceRise"}` | Per-input action |
        | `LeaveSession` | `{sessionId}` | Voluntary exit |
        
        ### Server → Client
        
        | Method | Args | Rate |
        |---|---|---|
        | `LobbyState` | `{playersInLobby}` | 1Hz |
        | `SessionAssigned` | `{sessionId, players, yourPlayerId}` | on match |
        | `CountdownTick` | `{sessionId, secondsRemaining}` | 3-2-1-GO |
        | `BoardState` | `{sessionId, boards: {playerId: BoardSnapshot}}` | on every state change (swap, clear, fall, garbage) |
        | `GameEnded` | `{sessionId, winner?, scoreboard}` | on round end |
        
        ## Game rules
        
        - Board: **6 wide × 12 tall.** Cells store colors 1-5 (5 distinct colors) or 6 (garbage).
        - Rise: every ~5 seconds, push a new row of random colors up from the bottom. All existing blocks shift up. If any block reaches row 0 (top), game over.
        - Cursor: 2 cells wide (highlights two horizontally-adjacent cells). Moves with arrow keys. Cannot go off-grid.
        - Swap action: swaps the two highlighted cells. Always succeeds (even if one or both are empty).
        - Match detection after swap (or after falls): scan grid for runs of 3+ same color in a row OR column. Mark all matched cells.
        - Clear: matched cells disappear (set to empty).
        - Fall: blocks above empty cells fall to fill the gaps.
        - Chain: if a fall creates new matches, increment chain length and repeat. Chain ends when a fall settles without new matches.
        - Scoring: each clear scores `cells_cleared * 10 * chain_length`. Bigger chains = exponentially more points.
        - **Garbage system: chains of length 2+ send garbage to opponent.** Garbage rows = (chain_length − 1). Garbage = solid rows of color 6 that count toward Game Over but can be CONVERTED back to playable blocks when an adjacent match clears (any match touching a garbage row converts the entire garbage row to random regular colors).
        - Force-rise: hold a key to instantly push the next row up (so you can clear faster when you're winning).
        
        ## AI bot
        
        Per tick (decision rate ~2Hz so the bot doesn't feel instantaneous):
        
        1. Scan grid for the highest "imminent match" opportunity — pairs of same-color blocks 1 swap away from forming a 3-match.
        2. If found: move cursor to that position, perform swap.
        3. Else: move cursor toward the column with the tallest stack and perform a swap there to disrupt it.
        
        Deterministic. Slower than top human play (humans can plan chains). Adequate for v0.
        
        ## Visuals + input
        
        Two boards side by side. Each board: 240px wide × 480px tall canvas (6×12 cells, 40px each). Player's own on left, opponent on right.
        
        Above each board: display name, score, chain indicator (if active). Below: nothing for v0.
        
        Block colors (the usual swap-puzzle palette):
        - 1=red, 2=cyan, 3=yellow, 4=green, 5=purple, 6=grey (garbage)
        
        Cursor: white outline around 2 highlighted cells.
        
        Input: arrow keys move cursor, space swaps, shift force-rises.
        
        ## Acceptance — ALL must pass
        
        ### Build + run
        - `dotnet build` of `PanelMatch.slnx` exits 0
        - `dotnet test` exits 0 with ≥10 simulation tests passing
        - `docker compose up` brings server up on port 5320
        - `curl localhost:5320/health` returns 200
        - `npm run dev` in `web/PanelMatch.Web/` serves the client
        - Browser at http://localhost:5173 can: join lobby → get matched (with bot filling) → play one game → see "Game Over" screen
        
        ### Test coverage — simulation library
        
        - 3-in-a-row horizontal match detected
        - 3-in-a-row vertical match detected
        - Swap that creates a match → cells clear
        - Chain: clear → fall → new match → chain_length=2 → more cells clear
        - Game-over: block reaches top row
        - Rise: row pushed up, existing blocks shift, top-out checked
        - Garbage row applied when opponent triggers chain
        - AI bot returns a valid (cursor_pos, action) for a non-trivial board
        
        ### Test coverage — integration (SignalR TestServer)
        
        - 2 mock SignalR clients join lobby, get matched, both receive SessionAssigned
        - Player + bot session: bot plays autonomously, game ends with a winner
        
        ## Out of scope for v0
        
        Accounts, persistence, leaderboards, mobile touch UI, replay, spectators, cosmetics, sound, private rooms, special block types (panel ⅓, ⅔ blocks), countdown-to-action animations, network rollback.
        
        ## Report format
        
        1. What was built (file list)
        2. What tests pass (`dotnet test` output)
        3. End-to-end works? (`docker compose up` + browser flow)
        4. Broken or incomplete? (specificity)
