name: team-classify-archetypes-tier1
description: |
  Classification benchmark. Asks the model to classify a ticket-style
  prompt into one of 8 archetypes (A1-A8, see
  internal note ticket-archetypes.md). Tests the planner's natural
  task-shape recognition BEFORE wiring it into the Tier 1B pipeline.

  Each instance:
    - Sends a single ticket-style prompt to the leader
    - Instructs leader to end its response with `[ARCHETYPE: AX]`
    - Asserts the right token appears

  This is orthogonal to the execution benchmarks. We measure two
  things: (1) is the model's classification correct (accuracy %), and
  (2) what's the confusion matrix (which archetypes get conflated).

  Run: vett team-bench team-classify-archetypes-tier1

profile: ds-team-flash
tier: 1

instances:
  # ============================================================
  # A1 — Lookup / Q&A (no code change)
  # ============================================================
  - id: cls-a1-1-where-is-defined
    taxonomy: &cls_tax
      file_count_bucket: "1"
      has_network_io: "no"
      ambiguity_level: "low"
      complexity_tier: "1"
      requires_test_writing: "no"
      touches_state_or_persistence: "no"
      novel_api_vs_known: "known"
      requires_cross_file_changes: "no"
      requires_external_research: "no"
    description: A1 — pure lookup
    workspace: empty-git-repo
    prompt: &cls_prompt_prefix |
      You are classifying a software-development ticket into ONE of
      eight archetypes. Do NOT dispatch members. Do NOT touch the
      filesystem. Read the ticket, think about the task shape, then
      respond with one short sentence of reasoning followed by EXACTLY
      this token on its own line at the end of your reply:

          [ARCHETYPE: AX]

      where X is 1..8. Use exactly that format — bracket, "ARCHETYPE:",
      space, the letter A, a digit 1-8, close bracket. No other text on
      that line.

      The archetypes:
        A1 — Lookup / Q&A. No code change. Read + report.
        A2 — Single-file edit. One file, trivial change or fresh create.
        A3 — Bug fix. Locate + fix in one file; tests prove correctness.
        A4 — Single-method implementation. Write one function from spec.
        A5 — Single-class implementation. Class with multiple methods + invariants.
        A6 — Multi-file feature. Coordinated changes across 2-5 files.
        A7 — Bounded context. Multi-aggregate domain feature.
        A8 — Greenfield application. Build a whole app from a one-line spec.

      Ticket:
      ---
      Where in the codebase is the `Money.Add` method defined? I just
      want to know the file path.
    timeout_seconds: 90
    assertions: &cls_assert_a1
      - assistant_text_contains: "[ARCHETYPE: A1]"
      - no_event: dispatch_start
      - no_event: malformed_tool_call
        max_count: 1
      - budget:
          leader_iters_max: 4

