  - id: sa-t0-py-05-user-summary-active
    taxonomy:
      language: "python"
      spec_change_kind: "add_response_field"
      diff_size_bucket: "1"
      pair_id: "05"
    description: |
      get_user_summary(user) returns {name, email}; should also include
      active. Single add_leaf op.
    workspace: empty-git-repo
    seed_files:
      ticket.md: |
        # Feature — user summary should include active status

        `get_user_summary(user)` currently returns `{name, email}`. Per
        the updated spec, it should also include `active`, sourced from
        `user.is_active`. Deterministically from input.
      current_spec.json: |
        {
          "spec_version": "0.4",
          "target": {"kind":"function","name":"get_user_summary",
                     "inputs":[{"name":"user","type":"User"}],
                     "stateful":false,"state_fields":{}},
          "types": {
            "User": {"kind":"record",
                     "fields":{"name":"string","email":"string",
                               "is_active":"boolean"}}
          },
          "return_exits": [
            {"id":"ok","when":"always","returns":"map<string,any>",
             "leaves":{
               "name":{"source":"user.name","determinism":"input",
                       "depends_on":["user"]},
               "email":{"source":"user.email","determinism":"input",
                        "depends_on":["user"]}
             }}
          ],
          "external_calls": []
        }
