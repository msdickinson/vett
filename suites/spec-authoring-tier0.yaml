  - id: sa-t0-py-04-clamp-raise-rename
    taxonomy:
      language: "python"
      spec_change_kind: "rename_exit_change_returns"
      diff_size_bucket: "2"
      pair_id: "04"
    description: |
      clamp(x) returns 0 for negatives; should raise invalid_argument.
      Tests the id-immutability rule: must be remove_exit + add_exit,
      NOT modify on `id` (would fail validation).
    workspace: empty-git-repo
    seed_files:
      ticket.md: |
        # Bug — clamp swallows negatives instead of erroring

        `clamp(x)` currently returns `0` for any negative `x`. Per the
        spec update, it should raise `invalid_argument("negative input")`
        instead. The non-negative branch is unchanged.
      current_spec.json: |
        {
          "spec_version": "0.4",
          "target": {"kind":"function","name":"clamp",
                     "inputs":[{"name":"x","type":"integer"}],
                     "stateful":false,"state_fields":{}},
          "types": {},
          "return_exits": [
            {"id":"neg_clamp","when":"x < 0","returns":"integer",
             "leaves":{"value":{"source":"0","determinism":"constant"}}},
            {"id":"identity","when":"x >= 0","returns":"integer",
             "leaves":{"value":{"source":"x","determinism":"input",
                                "depends_on":["x"]}}}
          ],
          "external_calls": []
