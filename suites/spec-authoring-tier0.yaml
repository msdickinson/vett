      .groundtruth/desired_diff.json: |
        {"spec_diff_version":"0.1","changes":[
         {"op":"remove_exit","path":"return_exits.neg_clamp"},
         {"op":"add_exit","at":"before:identity","value":{
           "id":"raise_neg","when":"x < 0","returns":"raises",
           "leaves":{"value":{"source":"raise invalid_argument(\"negative input\")",
                              "determinism":"constant"}}}}
        ]}
    prompt: |
