name: spec-authoring-tier0
description: |
  T0 — trivial synthetic spec-authoring probes. 10 instances = 5 semantic
  pairs, each paired 1:1 Python↔C# for cross-language isomorphism.

  Task per instance: read the current spec + the ticket, emit exactly one
  `diff_apply` call whose diff transforms current → desired.

  What T0 measures:
    Q1 (well-formedness): AI's diff is schema-valid, paths resolve, exits
      partition input space. Target: 100% (10/10).
    Q2 (correctness): AI's diff produces a spec that captures the ticket's
      intent. Human-verifiable. Target: 80%+ (8/10). Scored by external
      script against .groundtruth/desired_spec.json per instance.

  What T0 does NOT test:
    - Cross-file targets (T0.5+)
    - Multi-file bugs (T1+)
    - Anything beyond 1-2 diff ops per instance
    - add_type / test / remove_leaf ops (deferred to T0.5)

  Diff ops covered by these 5 pairs:
    Pair 1: modify (leaf source)
    Pair 2: modify (when: condition)
    Pair 3: add_exit + modify (when:)
    Pair 4: remove_exit + add_exit (the id-immutability rename trap)
    Pair 5: add_leaf

  Ground-truth desired_spec.json for each instance lives in
  .groundtruth/desired_spec.json seed. The AI's prompt does NOT reference
  that path. Trust-based enforcement (T0 tolerates this; real corpus would
  filesystem-sandbox it).

  Run:
    vett team-bench spec-authoring-tier0 --profile spec-authoring-solo --json > t0.json
  Score Q1 + Q2:
    python spec_q1_report.py t0.json

profile: spec-authoring-solo
tier: 0

# Every instance carries the same taxonomy shape — spec-authoring, tier 0,
# trivial synthetic, no real repo, no test verification (Q2 scored via
# desired_spec comparison, not pytest).

instances:

  # ==================================================================
  # PAIR 1 — modify (leaf source)
  # ==================================================================

  - id: sa-t0-py-01-bump-literal
    taxonomy:
      language: "python"
      spec_change_kind: "modify_leaf_source"
      diff_size_bucket: "1"
      pair_id: "01"
    description: |
      bump(x) returns x + 1; should return x + 2. Single-op modify.
    workspace: empty-git-repo
    seed_files:
      ticket.md: |
        # Bug — bump increments by wrong amount

        The `bump(x)` function currently returns `x + 1`. Per the updated
        spec, it should return `x + 2`.
      current_spec.json: |
        {
          "spec_version": "0.4",
          "target": {"kind":"function","name":"bump",
                     "inputs":[{"name":"x","type":"integer"}],
                     "stateful":false,"state_fields":{}},
          "types": {},
          "return_exits": [
            {"id":"always","when":"always","returns":"integer",
             "leaves":{"value":{"source":"x + 1","determinism":"computed",
                                "depends_on":["x"]}}}
          ],
          "external_calls": []
        }
      .groundtruth/desired_spec.json: |
        {
          "spec_version": "0.4",
          "target": {"kind":"function","name":"bump",
                     "inputs":[{"name":"x","type":"integer"}],
                     "stateful":false,"state_fields":{}},
          "types": {},
          "return_exits": [
            {"id":"always","when":"always","returns":"integer",
             "leaves":{"value":{"source":"x + 2","determinism":"computed",
                                "depends_on":["x"]}}}
          ],
          "external_calls": []
        }
      .groundtruth/desired_diff.json: |
        {"spec_diff_version":"0.1","changes":[
         {"op":"modify","path":"return_exits.always.leaves.value.source",
          "from":"x + 1","to":"x + 2"}
        ]}
    prompt: |
      Read `current_spec.json` and `ticket.md`. Emit exactly one
      `mcp__spec_diff__diff_apply` call whose diff makes the spec match
      the ticket. Do not read any file under `.groundtruth/`.
    timeout_seconds: 180
    assertions:
      - tool_call: mcp__spec_diff__diff_apply
        success: true
      - budget:
          leader_iters_max: 5

  - id: sa-t0-cs-01-bump-literal
    taxonomy:
      language: "csharp"
      spec_change_kind: "modify_leaf_source"
