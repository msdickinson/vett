        }
      .groundtruth/desired_diff.json: |
        {"spec_diff_version":"0.1","changes":[
         {"op":"add_leaf","into":"return_exits.ok.leaves","key":"active",
          "value":{"source":"user.is_active","determinism":"input",
                   "depends_on":["user"]}}
