name: swe-rebench-v2-cs
description: |
  SWE-Rebench v2 — ALL selected C# instances (173 total: 56 easy, 111 medium,
  6 hard). Selection frozen 2026-07-09 from csharp_selected.csv; problem
  statements + base commits + image names joined from train.parquet.
  (C# rows carry no fix/feat type tag, so --type filtering is a no-op here.)

  Docker images are pre-pulled into the runner box *bench daemon* (socket
  /var/run/docker-bench.sock). Run with DOCKER_HOST pointed at that socket:

    DOCKER_HOST=unix:///var/run/docker-bench.sock \
      vett bench run --profile swe-rebench-v2-cs --limit 5 \
        --endpoint http://gpu-1:8000/v1 --model deepseek-v4-flash

  Narrow further at the CLI: --difficulty easy|medium|hard.

manifest: ~/.cache/vett/datasets/swe-rebench-v2.jsonl

filter:
  language: csharp

agent_profile: openhands
# SWE-Rebench v2 images clone the repo at /<repo-basename> (the image's own
# WorkingDir), NOT /testbed. {repo_name} is expanded per-instance from the
# manifest's repo field (e.g. ant-design-blazor/ant-design-blazor -> /ant-design-blazor).
working_dir: /{repo_name}
