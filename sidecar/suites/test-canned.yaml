name: test-canned
description: |
  Tiny fixture suite used by unit tests and end-to-end smoke runs. Two
  canned instances in testdata/fixtures/canned-instances.jsonl. Not a
  real benchmark — the scorer is pass_fail.

loader:
  type: jsonl
  path: ../testdata/fixtures/canned-instances.jsonl

rendering:
  working_dir: /workspace
  fields:
    problem_statement: problem_statement
    base_commit: base_commit

sandbox:
  image_template: vett-test:{instance}
  default_cwd: /workspace

scorer:
  type: pass_fail
