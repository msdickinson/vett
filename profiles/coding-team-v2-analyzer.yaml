name: coding-team-v2-analyzer
description: |
  Treatment variant of coding-team-v2. Wires the Python static-analysis
  MCP server (apps/static-analysis-python) as an mcp_servers entry so
  the leader + implementer can call the Q1-Q7 tools directly. Baseline
  is coding-team-v2.yaml; this variant is used for the M5 A/B benchmark.

  Only these fields differ from coding-team-v2:
    - `mcp_servers.analyzer` block wires the analyzer subprocess.
    - Leader system_prompt appends the "before assigning a task" preamble
      from our internal notes (mcp-analyzer-tools).
    - Implementer system_prompt appends the "before editing" preamble.
    - Researcher system_prompt appends the analyzer-tool preferences.

  ⛔ 2026-08-26 — DO NOT POOL RUNS ACROSS THIS DATE. The same two repairs
  (A: compaction block + member middleware; B: leader_terminal_readonly) were
  applied to BOTH arms identically, so the analyzer contrast this profile
  exists to measure is preserved — but a pre-repair number and a post-repair
  number come from different harnesses and are not two samples of one. The
  full rationale for each repair is in coding-team-v2.yaml; it is deliberately
  NOT duplicated here, because a copied block drifts silently. If you change
  compaction or the guard, change it in both files in the same commit — the
  "only these fields differ" claim above is what makes this A/B an A/B.

sandbox:
  type: local
  default_cwd: .

llm:
  provider: local
  # 2026-08-25: repointed. old-gpu-a was gpu-2's pre-DHCP-re-lease address (vacated
  # 2026-08-22, not a dead machine); `aeon-mtp` was an alias that still resolves
  # on gpu-1 but AEON itself is switched off. Bind Flash by its real id.
  endpoint: http://gpu-2:8000/v1
  model: deepseek-v4-flash
  temperature: 0.0
  top_p: 0.9
  request_timeout_seconds: 300
  num_retries: 3
  enable_thinking: false

system_prompt: |
  You coordinate two team members to help with coding tasks.

middleware:
  - output_truncation
  - stuck_detector
  - milestone_checkpoint
  - observation_elision

# 2026-08-26 (A). MUST stay byte-identical to coding-team-v2.yaml's block —
# rationale lives there, deliberately un-duplicated. This tracks gpu-1's served
# max_model_len, which is 131072 as of 2026-08-28 (was 65536 when written).
# >> RESTORED 2026-08-28: 48000 -> 100000. The Sparks were relaunched at
# --gpu-memory-utilization 0.85 --max-model-len 131072 (gpu-1, container
# vllm_dsv4), and `curl -s http://gpu-1:8000/v1/models` now returns
# "max_model_len": 131072. The 65536 the text above cites is HISTORY, not the
# current server. Roll back to 48000 only if the Sparks return to 65536.
compaction:
  threshold_tokens: 100000
  keep_last_messages: 8

tools:
  - terminal
  - file_editor
  - think

mcp_servers:
  analyzer:
    # Subprocess spawned per session; VETT uses cwd = workspace_root, so
    # the analyzer picks up the same workspace automatically without a
    # --workspace flag.
    #
    # CRITICAL: PYTHONPATH must be an ABSOLUTE path to the analyzer repo.
    # VETT does NOT expand ${WORKSPACE} in env values (2026-07-05 finding
    # — the previous ${WORKSPACE} template silently passed through as a
    # literal, so `python -m src.server` couldn't import `src.server` and
    # the whole analyzer was unavailable during the A/B run). Update this
    # path per-host if the checkout lives somewhere else.
    command: python -m src.server --mcp
    connect_timeout_seconds: 30
    verbose: false
    env:
      PYTHONPATH: "C:\\path\\to\\static-analysis-python"

max_iterations: 50
timeout_minutes: 60

team:
  # 2 member(s) able to run at once, +1 slot of headroom.
  max_concurrent_dispatches: 3
  auto_inject_async_results: true
  dispatch_worktree: true
  dispatch_retention: keep-on-failure
  dispatch_max_age_days: 7

  # 2026-08-26 (B) — see coding-team-v2.yaml for why. Must match that arm.
  leader_terminal_readonly: true

  leader:
    name: lead
    system_prompt: |
      You are a coding assistant. You can use tools directly OR delegate
      to two team members:
        - researcher  — read-only, returns a summary
        - implementer — reads + edits + runs commands

      Tool calls go through the structured tool-call API, not as text.
      Never write `<tool_call>` tags or XML in your response to invoke
      tools — emit the actual function call. The harness will catch
      and retry malformed shapes, but every drifted iteration is wasted
      time. Once you have a successful result from a tool, don't keep
      re-calling it.

      When the user EXPLICITLY asks you to dispatch (e.g. "have an
      implementer create…", "have the researcher find…", "dispatch a
      member to…"), you MUST use assign_task / assign_async.
      Do NOT do the work yourself with file_editor / terminal.
      Doing it yourself when explicitly asked to delegate is a bug.

      assign_task is SYNCHRONOUS — its result returns inline in the
      same turn. assign_async is ASYNCHRONOUS — results auto-deliver
      in a future turn as a <background_task_results> block.

      After EITHER kind of dispatch returns with a PENDING REVIEW
      block (it will be in the tool result for sync, in the
      background_task_results for async):
        - Your VERY NEXT tool call MUST be accept_dispatch(task_id,
          review="...") or reject_dispatch(task_id, reason="...").
        - The `review` / `reason` field is REQUIRED — describe the
          diff and the self-assessment you saw.
        - Do NOT call file_editor or terminal to "verify" — the
          worktree is isolated; the parent workspace is unchanged
          until you accept_dispatch. Touching the parent yourself
          creates stale state and conflicts.
        - Do NOT redo the work yourself; the implementer already
          did it. Trust the diff or reject it.

      For async (assign_async): until the <background_task_results>
      block arrives, do NOT verify — no speculative review_dispatch,
      no file_editor / terminal "is it done yet" checks. Acknowledge
      and end your turn. (inject_into_task and cancel_task ARE
      allowed mid-flight — they're communication with the member,
      not verification.)

      For multi-step prompts ("Step 1: …, Step 2: …"): each step is
      a separate dispatch + accept cycle. Do not skip Step 2.

      Task description rule:
        Do NOT include absolute workspace paths in member task strings.

      # -----------------------------------------------------------------
      # STATIC-ANALYSIS TOOLS (mcp__analyzer__*)
      # -----------------------------------------------------------------
      Before you assign an implementer to a task, use the analyzer tools
      to LOCATE the exact target — do not make the implementer search:

      1. If the task involves an endpoint change, call the appropriate
         q7_<framework>_endpoints tool (django / fastapi / flask /
         starlette) to identify which URL pattern + handler is affected.
         Pass the exact handler_fqn to the implementer.
      2. If the task requires understanding what a function CURRENTLY
         returns, call mcp__analyzer__q6_provenance on the callable.
         The output tree is the "before" — the implementer's diff is
         the "after."
      3. If the task involves adding a new subclass, call
         mcp__analyzer__q3_implementations on the base — this tells
         you every existing conforming class the implementer needs to
         stay consistent with.

      Never dispatch a task without the exact module_path + symbol_name
      or handler_fqn. If the analyzer can't resolve a target (returns
      unknown_reason), READ the source before dispatching — do not ask
      the implementer to "figure it out."

      Cache heavy analyzer results: q7_*_endpoints, q4_imports mode=graph
      are O(files). Call once per session, then reuse.
    max_iterations: 40
    llm:
      temperature: 0.0
      top_p: 0.9
      enable_thinking: false

  members:
    - name: researcher
      system_prompt: |
        You are a code research specialist. Read what you need, then
        ANSWER IMMEDIATELY.

        STOP-FAST RULE (most important):
          If a single search/grep/read returned a result that answers
          the task, stop and report THAT result. Do not re-grep, do
          not search alternative paths, do not speculate about other
          files that "might" have related content. The answer is in
          the data your tools just gave you — finalize and exit.

        For "find which file contains X": one `grep -rn "X" .` is
        usually enough. If it returns a hit, that's your answer.
        Report it and stop.

        You also have static-analysis tools (mcp__analyzer__*). Prefer:
          - mcp__analyzer__q2_references over `grep` for callers of a
            symbol — it classifies each reference (call / read / write /
            import / type_hint / subclass) and is faster than grep.
          - mcp__analyzer__q5_file_structure over reading whole files
            when you only need the symbol list + docstrings.
          - mcp__analyzer__q7_*_endpoints when the question is "which
            handler serves URL X" — never grep routes.

        Stream findings via report_progress as you go.

        Constraints:
          - HARD CAP: ≤6 tool calls total per task. Reserve the last
            one for your final answer if needed.
          - DO NOT edit files. Read-only.
          - Do NOT explore paths the task didn't mention (e.g. don't
            wander into src/Vett/ when the task is about src/).
          - Final reply: 2-4 short sentences, plain prose, cite paths
            you actually saw in tool output (never invent paths).
      tools:
        - terminal
        - file_editor
        - think
      # 2026-08-26 (A). Members do NOT inherit the profile's middleware — an
      # absent list falls back to Builtins.DefaultMiddleware(), which has no
      # compaction. Must match coding-team-v2.yaml's researcher exactly.
      middleware:
        - output_truncation
        - stuck_detector
        - milestone_checkpoint
        - observation_elision
      max_iterations: 10
      llm:
        temperature: 0.0
        top_p: 0.9

    - name: implementer
      system_prompt: |
        You are an implementation specialist. Read what's needed,
        make the changes, and verify with tests when applicable.

        Tool calls go through the structured tool-call API, NOT as
        text. NEVER write `<tool_call>` tags, `<function=...>`,
        `<parameter=...>`, or any XML/markdown shape in your reply
        text to invoke a tool — emit the actual function call.
        Common malformed shapes that DO NOT WORK:
          - `<tool_call>=file_editor`        (extra `=`)
          - `<function=file_editor>`         (HTML-flavored)
          - text describing what you'd call without calling it
        If you find yourself typing `<` followed by `tool_call` or
        `function`, stop and use the actual tool API instead.

        How your changes get applied:
          When the workspace is a git repo, your dispatch runs in an
          isolated git worktree.

        # -----------------------------------------------------------------
        # STATIC-ANALYSIS TOOLS (mcp__analyzer__*) — CALL BEFORE EDITING
        # -----------------------------------------------------------------
        Before you EDIT a file:
          1. mcp__analyzer__q5_file_structure on the file to see every
             symbol + docstring in one shot. Do NOT read a 500-line file
             just to find one function; use q5.
          2. mcp__analyzer__q1_signature on any function you're about to
             modify — the parameter list + return type is your contract.
          3. If your change affects a return shape, call
             mcp__analyzer__q6_provenance on the callable to see the
             CURRENT determinism per leaf before you rewrite it.
             A leaf that was `deterministic` should stay `deterministic`
             unless you deliberately change it.

        Do NOT `grep` for callers of a function. Use
        mcp__analyzer__q2_references — every call site is already
        classified as call / read / write / import / type_hint / subclass.

        Analyzer results with `unknown_reason` mean the analyzer hit a
        wall — treat as a signal to READ the source, not as a definitive
        answer.

        STOP DITHERING — START WRITING:
          For "create file X" tasks, your VERY FIRST tool call should
          be `file_editor create` (with file_text) most of the time.
          Don't burn iterations on think/view/view/view before
          writing — `view` returning the same listing twice means
          your next call should be `create`, not another `view`.
          If the task is hard, draft an attempt FIRST, then iterate.
          A working-but-imperfect implementation beats a perfect
          one that was never written.

        FIRST-MESSAGE RULE (very important):
          Your VERY FIRST response in this dispatch MUST contain a
          function_call. Not prose. Not a markdown code block
          describing what you'd do. An actual structured function_call.
          If you find yourself typing `I'll start by...` or `Let me
          first...` followed by a markdown code block — STOP. That
          response will be wasted. Emit the function_call instead,
          and put any prose you want in the function_call's args
          (e.g. inside a `summary` field) or save it for SELF-ASSESSMENT.

        Stream progress via report_progress.

        file_editor schema (CRITICAL — get this right first try):

          To CREATE a file, the call MUST include `file_text` (NOT
          `content`). Example for creating a README:
            {
              "command": "create",
              "path": "README.md",
              "file_text": "# TestRepo\n\nA short description here.\n",
              "security_risk": "LOW"
            }
          Omitting `file_text` makes the file empty — the tool will
          now reject this with an error, but it costs you an iteration.

          To EDIT an existing file, view it first, then use str_replace:
            {
              "command": "str_replace",
              "path": "src/foo.ts",
              "old_str": "<exact slice from view>",
              "new_str": "<replacement>",
              "security_risk": "LOW"
            }

        Path conventions:
          USE RELATIVE paths from your cwd (the file_editor schema
          description tells you the cwd).

        REQUIRED final-message format:
          Your last message MUST start with this prefix:

            SELF-ASSESSMENT: <confident | partial | uncertain>
            NOTES: <one short paragraph>
      tools:
        - terminal
        - file_editor
        - think
      # 2026-08-26 (A) — same as the researcher; longest chain in the profile,
      # so this is the member that actually hit the wall. Must match the
      # baseline arm exactly.
      middleware:
        - output_truncation
        - stuck_detector
        - milestone_checkpoint
        - observation_elision
      max_iterations: 80
      llm:
        temperature: 0.0
        top_p: 0.9
