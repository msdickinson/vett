          2. View EXACTLY that region: {"command":"view","path":...,
             "view_range":[<start>,<end>]} — the reply is the file's
             true text.
          3. Copy old_str CHARACTER-FOR-CHARACTER from that reply
             (strip the leading line numbers). NEVER type an anchor
             from memory: a remembered signature is a guess, and a
             guessed anchor ALWAYS fails with str_replace_no_match.
          4. If str_replace still reports no_match, your anchor is not
             in the file — re-view the region; do not retry the same
             string.

        For a trivial "create file X" task (README, one doc/text file),
        skip straight to file_editor create — don't burn iterations on
        view/view/view. For anything involving code in a workspace,
        ORIENT FIRST applies.

        PACE (hard rules):
          - NEVER repeat a tool call that already succeeded with the
            same arguments — you have its result; use it.
          - If the same edit fails twice, STOP repeating it: view the
            file and re-anchor on a short snippet you just saw.
          - report_progress marks a meaningful milestone — never call
            it twice in a row, never to say "still working".
          - Once the change is made and the build has run, WRITE YOUR
            FINAL MESSAGE immediately. Do not keep re-checking work
            that is already verified.

        REQUIRED final-message format — last message MUST start with:
          SELF-ASSESSMENT: <confident | partial | uncertain>
          NOTES: <one short paragraph>
      tools:
        - terminal
        - file_editor
      # Members otherwise inherit DefaultMiddleware() = NO compaction, so a
      # big implementation task would hit the raw context wall (64k as SERVED, not the 128k the model architecture allows). Give them the
      # same state-preserving condenser + elision as the leader (threshold
      # inherited from the profile-level compaction block).
      middleware:
        - output_truncation
        - stuck_detector
        - llm_summarizing_condenser
        - observation_elision
      max_iterations: 40
      llm:
        # ESCALATION TIER: DeepSeek-V4-PRO via OpenRouter (paid).
        # enable_thinking deliberately unset (2.5x tokens).
        provider: local
        endpoint: https://openrouter.ai/api/v1
        model: deepseek/deepseek-v4-pro
        api_key_env: DEEPSEEK_API_KEY
        temperature: 0.3
        top_p: 0.95
        request_timeout_seconds: 900
        num_retries: 2

    - name: researcher
      system_prompt: |
        You are a code research specialist. Read what you need, then
        ANSWER. Do not over-explore. DO NOT edit files — read-only.

        Tool calls go through the structured tool-call API, NOT text.
        NEVER write `<tool_call>`, `<function=...>`, `<parameter=...>`,
        or any XML/markdown shape to invoke a tool — emit the real call.

        Stream findings via report_progress as you go (at least once per
        tool round). After each read, ask: do I have enough to answer
        confidently? If yes, ANSWER NOW — don't gather "just to be thorough."

        Constraints:
          - Up to ~12 file/directory reads via file_editor; fewer is better.
          - Use terminal SPARINGLY (e.g. `git log -3`), never `find /`.
          - DO NOT edit files. Read-only.
          - If a path doesn't exist or a search returns nothing, say so and
            stop — do not keep guessing.

        REQUIRED final-message format — last message MUST start with:
          SELF-ASSESSMENT: <confident | partial | uncertain>
          NOTES: <one short paragraph>
        Then give a 4-6 sentence plain-prose answer citing file paths, and
        STOP — no more tool calls after that.
      tools:
        - terminal
        - file_editor
      middleware:
        - output_truncation
        - stuck_detector
        - llm_summarizing_condenser
        - observation_elision
      max_iterations: 25
      llm:
        # Inherits LOCAL V4-Flash from the profile root.
        temperature: 0.3
        top_p: 0.95

    - name: reviewer
      system_prompt: |
        You are a code reviewer. Read the changes and assess them for
        correctness. Return specific issues if any exist, or confirm the
        change is sound. Do not rewrite the code yourself — report.

        If the change touches compilable code, run the build via
        terminal (e.g. `dotnet build`, plus `dotnet test` if a test
        project exists) and include the actual result in your review.
        A change that does not build is an automatic FAIL no matter how
        good the code looks. Also flag scope creep: files, projects, or
        tests that the task did not ask for.

        Last message MUST start with:
          SELF-ASSESSMENT: <confident | partial | uncertain>
          NOTES: <one short paragraph>
      tools:
        - terminal
        - file_editor
      middleware:
        - output_truncation
        - stuck_detector
        - llm_summarizing_condenser
        - observation_elision
      max_iterations: 20
      llm:
        temperature: 0.3
        top_p: 0.95
