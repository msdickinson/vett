name: ds-solo-flash
description: |
  SOLO / FLASH (2026-07-12): one agent, no team, DeepSeek-V4-Flash on
  the DGX Sparks (TP=2, local, $0 marginal). This is the FLOOR of the
  five-way comparison: what does the cheap model do with no leader, no
  reviewer, and no decomposition helping it?

  Every team profile answers "does structure help?" — but that question
  is meaningless without a no-structure control. This is that control.
  Whatever ds-team-flash (same model, four seats) scores ABOVE this,
  that delta IS the value of the team scaffold, isolated.

  PAIRED WITH ds-solo-pro. The two solo profiles are byte-identical
  below this description EXCEPT the `llm:` block. That is deliberate:
  solo-flash vs solo-pro isolates RAW MODEL CAPABILITY with prompt,
  tools, middleware, compaction and iteration budget all held constant.
  If you edit the prompt here, edit it there too or the comparison is
  dead.

  Requires NO api key (LAN vLLM).

  ENDPOINT AS MEASURED 2026-07-12 via $0 GET /v1/models: gpu-1 :8000
  served BOTH ids `aeon-mtp` AND `deepseek-v4-flash`, both with root
  deepseek-ai/DeepSeek-V4-Flash-DSpark, max_model_len 131072. They are
  aliases for the same instance.

  ⛔ THE 131072 ABOVE IS A RECORD OF 2026-07-12, NOT A CURRENT FACT. It
  is left standing because it is what was actually observed that day —
  rewriting a measurement to match a later one destroys the evidence
  that the server MOVED. RE-MEASURED 2026-08-26 via $0 GET /v1/models:
  max_model_len was 65536 THAT DAY. See the compaction block below for
  why that halving mattered and what it forced.

  RE-MEASURED AGAIN 2026-08-28 (same $0 GET, independently confirmed by
  `vett capacity probe`): max_model_len is 131072 -- back where it
  started. The engine was restarted under a different --max-model-len
  between the two readings, and every other number moved with it (the
  GPU KV pool went 629666 -> 1408266 tokens), which is the signature of
  a RESTART rather than of drift in one value. Both readings above stand
  as records of what the server served ON THEIR DATES, per the rule at
  the top of this block. The one that governs TODAY is 131072.

  ⛔ USE `deepseek-v4-flash`, NEVER `aeon-mtp`. Both ids still resolve
  on gpu-1 (re-confirmed 2026-08-26), so binding the alias does not
  error — it fails SILENTLY-WELL, which is worse: the run works and the
  record names a model that is not the one Mark turned off. The id
  below names the weights honestly.

  NOTE: no `enable_thinking` line by design — see dsv4-team-cloud.yaml.

sandbox:
  type: local
  default_cwd: .

llm:
  provider: local
  endpoint: http://gpu-2:8000/v1
  model: deepseek-v4-flash
  temperature: 0.3
  top_p: 0.95
  request_timeout_seconds: 900
  num_retries: 2

# SOLO: no `team:` block. The agent below IS the whole harness — it
# reads, edits, builds and verifies with its own tools. Keep this prompt
# in sync with ds-solo-pro.yaml.
system_prompt: |
  You are a careful engineer. Make the smallest correct change that
  solves the problem. Read before you edit.

  ORIENT FIRST (hard rule): before creating or editing ANY file, your
  FIRST tool call MUST list the workspace (terminal: `git ls-files` — it
  shows every tracked file instantly). If a project already exists
  (.csproj/.sln/package.json/etc.), ALL your changes go inside that
  project's folders — never at the repo root, never in a new project.

  SCOPE GUARD (hard rule): implement ONLY what the task asks, in the
  files the task names (or files that must change for those to work).
  Do NOT scaffold new projects, do NOT add packages, and do NOT write
  your own test files unless the task explicitly asks for them. Files
  nobody asked for are defects, not diligence. A stub left with a TODO
  is not done.

  BUILD GATE (hard rule): if your change touches compilable code, you
  MUST run the build via terminal before you finish — `dotnet build
  <folder containing the .csproj you changed>` — and if a test project
  already exists, `dotnet test <test project folder>` too. If the build
  fails with "does not contain a project or solution file", your files
  are in the WRONG PLACE: find the existing project (`git ls-files --
  '*.csproj'`) and move your changes into it — do NOT create a new
  project to get a green build. "No tests found" is NOT "tests pass" —
  never claim tests pass unless real tests executed. Never report
  confidence on a broken build.

  Tool calls go through the structured tool-call API, NOT text. NEVER
  write `<tool_call>`, `<function=...>`, `<parameter=...>`, or any
  XML/markdown shape to invoke a tool — emit the real call.

  file_editor schema (get it right first try):
    CREATE requires `file_text` (NOT `content`):
      {"command":"create","path":"README.md",
       "file_text":"# Title\n","security_risk":"LOW"}
    EDIT: view first, then str_replace with an exact slice:
      {"command":"str_replace","path":"src/foo.cs",
       "old_str":"<exact slice>","new_str":"<replacement>",
       "security_risk":"LOW"}
    Use RELATIVE paths from your cwd.

  LARGE-FILE EDIT PROTOCOL (hard rule): a full view of a big file gets
  TRUNCATED — you did not see the middle. To edit any file longer than
  ~200 lines:
    1. Locate the region: terminal `grep -n "<method or marker>" <file>`
       gives you real line numbers.
    2. View EXACTLY that region: {"command":"view","path":...,
       "view_range":[<start>,<end>]}.
    3. Copy old_str CHARACTER-FOR-CHARACTER from that reply (strip the
       leading line numbers). NEVER type an anchor from memory: a
       remembered signature is a guess, and a guessed anchor ALWAYS
       fails with str_replace_no_match.
    4. If str_replace still reports no_match, re-view the region; do not
       retry the same string.

  PACE (hard rules):
    - NEVER repeat a tool call that already succeeded with the same
      arguments — you have its result; use it.
    - If the same edit fails twice, STOP repeating it: view the file and
      re-anchor on a short snippet you just saw.
    - Once the change is made and the build has run clean, WRITE YOUR
      FINAL MESSAGE immediately. Do not re-check work already verified.

  REQUIRED final-message format — your last message MUST start with:
    SELF-ASSESSMENT: <confident | partial | uncertain>
    NOTES: <one short paragraph with the ACTUAL build/test result>

tools:
  - terminal
  - file_editor

middleware:
  - output_truncation
  - stuck_detector
  - llm_summarizing_condenser
  - observation_elision

# Same threshold as ds-team-flash — same server, so the SAME served
# window: max_model_len 131072 (re-measured 2026-08-28 by $0 GET
# /v1/models and independently by `vett capacity probe`; it read 65536
# on 2026-08-26 and 131072 before that -- the launch flag has moved
# twice, the weights never).
#
# ⚠ THIS EXACT LINE HAS NOW BEEN WRONG TWICE, BOTH TIMES THE SAME WAY: a
# re-measurement reached the block below and not this one-line summary
# above it, leaving the file stating two different windows at once and
# handing the retracted one to anyone who skims. Readers read ROWS, not
# SECTIONS. If a window changes anywhere in this file, change it HERE in
# the same edit.
compaction:
  # WARNING: threshold_tokens MUST stay below the SERVED context of the
  # SMALLEST model in this profile. Verify with:
  #     curl -s http://gpu-2:8000/v1/models
  # 2026-08-23: the Sparks run dsv4-launch-hi.sh (gpu-memory-utilization 0.80)
  # because the locked 131-93 config no longer fits -- the mcrely-* Minecraft
  # containers now co-reside in GB10 unified memory and free GPU memory came in
  # at 103.96 GiB against the 113.11 GiB that 0.93 demands. /v1/models therefore
  # reported max_model_len=65536 THEN, NOT the 131072 these profiles were
  # written for, and against a 64k server the 100000 trigger could NEVER FIRE:
  # vLLM rejects the request on context length first, so the run DIES instead
  # of compacting. That is why this sat at 48000.
  #
  # >> RESTORED 2026-08-28. The precondition the line below demanded is met. <<
  # The Sparks were relaunched at --gpu-memory-utilization 0.85
  # --max-model-len 131072 (gpu-1, container vllm_dsv4). Re-confirmed by
  # reading the server, not by assuming it:
  #     curl -s http://gpu-2:8000/v1/models
  # returns "max_model_len": 131072 for BOTH served ids (deepseek-v4-flash and
  # the stale aeon-mtp alias -- one engine, two names). 100000 leaves ~31k for
  # the completion plus tool schemas, proportionally MORE headroom than the
  # 48000/65536 it replaces. 0.90 was asked for and does not fit today: the
  # mcrely-* / mcsim-diff Minecraft co-tenants hold the difference. Full
  # measurement in docs/infra/deepseek-v4-flash-dgx.md.
  # If the Sparks are ever rolled back to 65536, drop this to 48000 again --
  # the rollback container vllm_dsv4_ctx65k is preserved on both nodes.
  threshold_tokens: 100000
  keep_last_messages: 8

# A solo agent does ALL the work the team spreads across four seats, so
# it needs the leader's full budget — not a member's 40.
max_iterations: 200
timeout_minutes: 180
